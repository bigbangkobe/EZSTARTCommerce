                  expiresAt: { type: [string, 'null'], format: date-time }
        orders:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [orderNumber, orderStatus, paymentStatus, fulfillmentStatus, currency, totalMinor, placedAt, linkedAt, linkSource]
            properties:
              orderNumber: { type: string }
              orderStatus: { type: string }
