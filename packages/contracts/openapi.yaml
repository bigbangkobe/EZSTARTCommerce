      - userId
      - status
      - version
      - expiresAt
      - lastSentAt
      - notificationJobId
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
        version:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
        lastSentAt:
          type: string
          format: date-time
        notificationJobId:
          type:
          - string
          - 'null'
          format: uuid
    MarketReviewRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      - evidenceReference
      - reason
      - validUntil
      - confirmedMarketCode
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
          - revoked
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
        confirmedMarketCode:
          type: string
          minLength: 2
          maxLength: 16
    MarketReviewRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - marketCode
      - decision
      - evidenceReference
      - reason
      - reviewedBy
      - reviewedAt
      - validUntil
      - storeConfigVersion
      properties:
        id:
          type: string
          format: uuid
        marketCode:
          type: string
          minLength: 2
          maxLength: 16
        decision:
          type: string
          enum:
          - approved
          - rejected
          - revoked
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        reviewedBy:
          type: string
          format: uuid
        reviewedAt:
          type: string
          format: date-time
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
        storeConfigVersion:
          type: integer
          minimum: 1
    HealthStatus:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: alive
    AdminInvitationSummaryEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminInvitationSummary'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MarketReviewRecordEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/MarketReviewRecord'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    HealthStatusEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/HealthStatus'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BootstrapOwnerRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - displayName
      - password
      - locale
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true
        locale:
          type: string
          enum:
          - zh-CN
          - zh-HK
          - en
    AcceptAdminInvitationRequest:
      type: object
      additionalProperties: false
      required:
      - invitationToken
      - newPassword
      properties:
        invitationToken:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
        newPassword:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true
    AdminPasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        newPassword:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true
    AdminMfaSetupChallenge:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - nextAction
      - expiresAt
      properties:
        challengeId:
          type: string
          format: uuid
        nextAction:
          type: string
          const: enroll_mfa
        expiresAt:
          type: string
          format: date-time
    AuthorizeMfaEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        currentMfaCode:
          type: string
          minLength: 6
          maxLength: 32
          writeOnly: true
    StartMfaEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
      - challengeId
      properties:
        challengeId:
          type: string
          format: uuid
    ConfirmMfaEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - enrollmentId
      - code
      properties:
        challengeId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^\d{6}$
          writeOnly: true
    AdminMfaEnrollment:
      type: object
      additionalProperties: false
      required:
      - enrollmentId
      - expiresAt
      - totpSecret
      - provisioningUri
      properties:
        enrollmentId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        totpSecret:
          type: string
          pattern: ^[A-Z2-7]+$
          readOnly: true
          description: One-time TOTP provisioning secret; never log/cache. Store encrypted, not as a hash, to verify
            subsequent TOTP codes.
        provisioningUri:
          type: string
          format: uri
          pattern: ^otpauth://totp/
          readOnly: true
    AdminMfaEnrollmentConfirmed:
      type: object
      additionalProperties: false
      required:
      - session
      - recoveryCodes
      properties:
        session:
          $ref: '#/components/schemas/AdminSessionData'
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 20
            maxLength: 20
            readOnly: true
          description: Shown only on successful enrollment confirmation. Server stores only hashes; never return on
            session or staff reads.
    AdminSessionView:
      type: object
      additionalProperties: false
      required:
      - id
      - createdAt
      - lastSeenAt
      - idleExpiresAt
      - absoluteExpiresAt
      - current
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    AdminSessionRevoked:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - revokedAt
      properties:
        sessionId:
          type: string
          format: uuid
        revokedAt:
          type: string
          format: date-time
    AdminMfaSetupChallengeEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminMfaSetupChallenge'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminMfaEnrollmentEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminMfaEnrollment'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminMfaEnrollmentConfirmedEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminMfaEnrollmentConfirmed'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminSessionRevokedEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminSessionRevoked'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminAuthenticationChallengeEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          oneOf:
          - $ref: '#/components/schemas/AdminMfaChallenge'
          - $ref: '#/components/schemas/AdminMfaSetupChallenge'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminSessionListEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - items
          - nextCursor
          - hasMore
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminSessionView'
            nextCursor:
              type:
              - string
              - 'null'
              maxLength: 2048
            hasMore:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - displayName
      - locale
      - status
      - roleIds
      - mfaRequired
      - mfaEnabled
      - mustChangePassword
      - version
      - lastLoginAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: 登录账号名。历史上存邮箱，实例可改用任意账号名（如 admin、zhangsan）。
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          enum:
          - zh-CN
          - zh-HK
          - en
        status:
          type: string
          enum:
          - invited
          - active
          - suspended
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        mfaRequired:
          type: boolean
        mfaEnabled:
          type: boolean
        mustChangePassword:
          type: boolean
          description: 直建账号使用一次性初始密码时为真；除改密与登出外的后台接口一律 403。
        version:
          type: integer
          minimum: 1
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminSessionData:
      type: object
      additionalProperties: false
      required:
      - user
      - permissionCodes
      - mfaVerified
      - idleExpiresAt
      - absoluteExpiresAt
      - csrfToken
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
          properties:
            status:
              const: active
        permissionCodes:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_.]{1,99}$
          uniqueItems: true
        mfaVerified:
          type: boolean
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
          description: Session-bound CSRF token; never log or persist in analytics.
      allOf:
      - if:
          properties:
            user:
              properties:
                mfaRequired:
                  const: true
              required:
              - mfaRequired
          required:
          - user
        then:
          properties:
            mfaVerified:
              const: true
            user:
              properties:
                mfaEnabled:
                  const: true
    AdminMfaChallenge:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - nextAction
      - allowedMethods
      - expiresAt
      properties:
        challengeId:
          type: string
          format: uuid
        nextAction:
          type: string
          const: verify_mfa
        allowedMethods:
          type: array
          items:
            type: string
            enum:
            - totp
            - recovery_code
          minItems: 1
          uniqueItems: true
        expiresAt:
          type: string
          format: date-time
    PasswordResetAccepted:
      type: object
      additionalProperties: false
      required:
      - requestAccepted
      properties:
        requestAccepted:
          type: boolean
          const: true
    AdminSessionsRevoked:
      type: object
      additionalProperties: false
      required:
      - userId
      - revokedCount
      - revokedAt
      properties:
        userId:
          type: string
          format: uuid
        revokedCount:
          type: integer
          minimum: 0
        revokedAt:
          type: string
          format: date-time
    AdminAuditLog:
      type: object
      additionalProperties: false
      description: Append-only record. Application code never edits or deletes audit rows.
      required:
      - id
      - actorId
      - action
      - objectId
      - result
      - requestId
      - reason
      - occurredAt
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type:
          - string
          - 'null'
          format: uuid
          description: Null for unauthenticated attempts such as a denied login.
        action:
          type: string
          maxLength: 100
        objectId:
          type:
          - string
          - 'null'
          maxLength: 100
        result:
          type: string
          maxLength: 32
        requestId:
          type: string
          maxLength: 100
        reason:
          type:
          - string
          - 'null'
          maxLength: 1000
        occurredAt:
          type: string
          format: date-time
    AdminAuditLogListEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - items
          - nextCursor
          - hasMore
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminAuditLog'
            nextCursor:
              type:
              - string
              - 'null'
              maxLength: 2048
            hasMore:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminRole:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - permissionCodes
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum:
          - owner
          - admin
          - preset
          - custom
          description: owner 为不可编辑的店主角色；admin/preset 为默认岗位权限包；custom 为自建角色。
        presetKey:
          type:
          - string
          - 'null'
          pattern: ^[a-z][a-z0-9_]{1,39}$
          description: 默认岗位权限包的稳定标识，角色改名后不变；自定义角色为 null。
        description:
          type:
          - string
          - 'null'
          maxLength: 500
        permissionCodes:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_.]{1,99}$
          uniqueItems: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MarketProfile:
      type: object
      additionalProperties: false
      required:
      - marketCode
      - enabled
      - eligibleProductIds
      - reviewStatus
      - reviewValidUntil
      properties:
        marketCode:
          type: string
          minLength: 2
          maxLength: 16
        enabled:
          type: boolean
        eligibleProductIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        reviewStatus:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - revoked
          - expired
        reviewValidUntil:
          type:
          - string
          - 'null'
          format: date-time
      allOf:
      - if:
          properties:
            enabled:
              const: true
          required:
          - enabled
        then:
          properties:
            reviewStatus:
              const: approved
    StoreConfiguration:
      type: object
      additionalProperties: false
      required:
      - displayName
      - locales
      - defaultLocale
      - baseCurrency
      - timezone
      - marketProfiles
      - featureFlags
      - brandAssets
      - version
      - updatedAt
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locales:
          type: array
          items:
            type: string
            enum:
            - zh-CN
            - zh-HK
            - en
          minItems: 1
          uniqueItems: true
        defaultLocale:
          type: string
          enum:
          - zh-CN
          - zh-HK
          - en
        baseCurrency:
          type: string
          pattern: ^[A-Z]{3}$
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          description: Valid IANA zone; server validates existence.
        marketProfiles:
          type: array
          items:
            $ref: '#/components/schemas/MarketProfile'
        featureFlags:
          type: object
          additionalProperties:
            type: boolean
        brandAssets:
          type: object
          additionalProperties: false
          required:
          - logoMediaId
          - faviconMediaId
          properties:
            logoMediaId:
              type:
              - string
              - 'null'
              format: uuid
            faviconMediaId:
              type:
              - string
              - 'null'
              format: uuid
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    AdminSessionEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminSessionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminMfaChallengeEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminMfaChallenge'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PasswordResetAcceptedEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/PasswordResetAccepted'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminUserEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminUser'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminSessionsRevokedEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminSessionsRevoked'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminRoleEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminRole'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    StoreConfigurationEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/StoreConfiguration'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminUserListEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - items
          - nextCursor
          - hasMore
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
            nextCursor:
              type:
              - string
