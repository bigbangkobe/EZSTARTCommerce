  /admin/inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      summary: List SKU stock, reservations and low-stock thresholds
      description: >-
        Every variant appears, including ones that were never stocked (on hand 0, version 0).
        Available = onHand - reserved is computed server-side and is the only number clients
        should use; lowStock=1 keeps rows whose available is at or below the threshold.
      security: [{ AdminSession: [] }]
      x-permission: inventory.read
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/SearchQuery' }
        - name: variantId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: lowStock
          in: query
          required: false
          description: 1 or true keeps rows at or below their low-stock threshold.
          schema: { type: string, enum: ['1', '0', 'true', 'false'] }
      responses:
        '200': { $ref: '#/components/responses/InventoryListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
