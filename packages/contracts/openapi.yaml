      tags: [Inventory]
      operationId: createInventoryAdjustment
      summary: Append an inventory adjustment movement
      description: >-
        Adjustments are deltas, never absolute values. A decrease may not eat reserved units:
        available must stay at or above zero. The request carries the inventory version the
        operator saw, so a concurrent adjustment fails instead of overwriting it.
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: inventory.adjust
      x-mfa-required: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
