components:
  securitySchemes:
    DeploymentBootstrap:
      type: apiKey
      in: header
      name: X-Bootstrap-Token
      description: High-entropy single-use deployment secret provisioned outside the web API; bootstrap endpoint disabled
        after first owner is committed. Never put in URLs, images, logs or ordinary config.
    AdminMfaSetup:
      type: apiKey
      in: cookie
      name: ez_admin_setup
      description: Browser-bound short-lived enrollment capability; never authorizes admin business APIs or verification
        of an existing factor.
    AdminLoginChallenge:
      type: apiKey
      in: cookie
      name: ez_admin_challenge
      description: Short-lived browser-bound pre-authentication cookie; authorizes only MFA verification and never admin resources.
    AdminSession:
      type: apiKey
      in: cookie
      name: ez_admin_session
      description: HttpOnly, Secure, SameSite session cookie; server-side session is revocable.
    GuestCartSession:
      type: apiKey
      in: cookie
      name: ez_guest_cart
      description: Random high-entropy guest cart session; does not authorize order/customer access.
    MemberSession:
      type: apiKey
      in: cookie
      name: ez_member_session
      description: Optional verified member session; never required for guest checkout.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on cookie-authenticated state-changing browser requests.
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageKey:
      name: pageKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 180 }
    ProviderCode:
      name: provider
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$' }
    ReportKey:
      name: reportKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$' }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    SearchQuery:
      name: q
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    Locale:
      name: locale
      in: query
      required: true
      schema: { type: string, enum: [zh-CN, zh-HK, en] }
    MarketCode:
      name: marketCode
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 16 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: ETag for optimistic concurrency; stale value returns VERSION_CONFLICT.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
      description: Same key and same request returns the original result; same key with different request returns IDEMPOTENCY_CONFLICT.
  headers:
    X-Request-Id:
      description: Correlation ID for this request.
      schema: { type: string, maxLength: 128 }
    Retry-After:
      description: Seconds before a limited client may retry.
      schema: { type: integer, minimum: 1 }
  responses:
    ReadinessSuccess:
      description: Configured identity database and checked migrations are ready.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReadinessStatusEnvelope' }
    AdminInvitationSuccess:
      description: AdminInvitationSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
        ETag:
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
          description: Invitation version, not user version; required by resend/revoke.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminInvitationSummaryEnvelope'
    MarketReviewSuccess:
      description: MarketReviewSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
        ETag:
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
          description: New StoreConfiguration version after recording review; recording approval does not enable trading.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketReviewRecordEnvelope'
    HealthSuccess:
      description: HealthSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthStatusEnvelope'
    AdminMfaSetupRequired:
      description: AdminMfaSetupRequired
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
        Set-Cookie:
          schema:
            type: string
          description: Sets ez_admin_setup; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/admin/auth/mfa. Short-lived
            enrollment capability bound to challengeId and browser. Grants no admin resource access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminMfaSetupChallengeEnvelope'
    AdminMfaEnrollmentSuccess:
      description: AdminMfaEnrollmentSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminMfaEnrollmentEnvelope'
    AdminMfaEnrollmentConfirmedSuccess:
      description: AdminMfaEnrollmentConfirmedSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
        Set-Cookie:
          schema:
            type: string
          description: Rotates formal ez_admin_session (HttpOnly; Secure; SameSite=Lax; Path=/api/v1/admin); consumes
            and clears ez_admin_setup using its original Path; revokes previous admin sessions. Never include session
            credentials in JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminMfaEnrollmentConfirmedEnvelope'
    AdminSessionListSuccess:
      description: AdminSessionListSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminSessionListEnvelope'
    AdminSessionRevokedSuccess:
      description: AdminSessionRevokedSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminSessionRevokedEnvelope'
    AdminSessionSuccess:
      description: AdminSessionSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not cache admin identity or configuration responses.
        Set-Cookie:
          schema:
            type: string
          description: Login/MFA success issues or rotates ez_admin_session; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/admin.
            Session reads do not require reissuing it. No session credential in JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminSessionEnvelope'
    AdminMfaRequired:
      description: Password accepted; challenge only. No authenticated admin session is issued before MFA. Challenge
        is short-lived, single-use and bound to this browser authentication attempt.
      headers:
        Set-Cookie:
          schema: { type: string }
          description: For verify_mfa issues ez_admin_challenge; for enroll_mfa issues ez_admin_setup with identical flags/path; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/admin/auth/mfa. Bound to challengeId and authentication attempt. MFA success consumes it and clears this cookie with the same Path. Never issues ez_admin_session here.
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not cache admin identity or configuration responses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminAuthenticationChallengeEnvelope'
    PasswordResetRequestAccepted:
      description: Uniform accepted response for valid requests, whether the email exists or not. Completion revokes
        all existing sessions and does not log the user in.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not cache admin identity or configuration responses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetAcceptedEnvelope'
    AdminUserSuccess:
      description: AdminUserSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not cache admin identity or configuration responses.
        ETag:
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
          description: Quoted decimal resource version; echo unchanged as If-Match.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserEnvelope'
    AdminUserListSuccess:
      description: AdminUserListSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not cache admin identity or configuration responses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserListEnvelope'
    AdminSessionsRevokedSuccess:
      description: AdminSessionsRevokedSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not cache admin identity or configuration responses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminSessionsRevokedEnvelope'
    AdminRoleSuccess:
      description: AdminRoleSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not cache admin identity or configuration responses.
        ETag:
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
          description: Quoted decimal resource version; echo unchanged as If-Match.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminRoleEnvelope'
    AdminRoleListSuccess:
      description: AdminRoleListSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not cache admin identity or configuration responses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminRoleListEnvelope'
    StoreConfigurationSuccess:
      description: StoreConfigurationSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not cache admin identity or configuration responses.
        ETag:
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
          description: Quoted decimal resource version; echo unchanged as If-Match.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreConfigurationEnvelope'
    Success:
      description: Successful request
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    OtpChallengeAccepted:
      description: Uniform response for a syntactically valid OTP request; never reveals membership existence. Challenge ID is a correlation handle, not an authentication secret.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OtpChallengeEnvelope' }
    ProductSuccess:
      description: Product object
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductEnvelope' }
    ProductListSuccess:
      description: Product collection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductListEnvelope' }
    PublicProductSuccess:
      description: Public product object with only published and eligible fields
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicProductEnvelope' }
    PublicProductListSuccess:
      description: Public product collection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicProductListEnvelope' }
    ProductPublishSuccess:
      description: Product publication result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductPublishEnvelope' }
    ImportJobSuccess:
      description: Import job and counters
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ImportJobEnvelope' }
    ImportPreviewSuccess:
      description: Import validation preview; no product rows are written
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ImportPreviewEnvelope' }
    QuoteSuccess:
      description: Authoritative checkout quote
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QuoteEnvelope' }
    OrderCreatedSuccess:
      description: Created order and next payment action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderCreatedEnvelope' }
    OrderListSuccess:
      description: Order collection with masked contact fields
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderListEnvelope' }
    OrderDetailSuccess:
      description: Order snapshot and status history
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderDetailEnvelope' }
    Created:
      description: Resource created
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Accepted:
      description: Request accepted for asynchronous processing
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    BadRequest:
      description: Malformed or invalidly signed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing, invalid, expired or revoked authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated caller lacks the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found or not visible to caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: State, version, uniqueness or idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Request shape or business validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Request rate exceeded
      headers:
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: A required service is temporarily unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnexpectedError:
      description: Unexpected server error; response must not expose internal details
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ReadinessStatusEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, const: ready }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AdminInvitationSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - userId
      - status
      - version
      - expiresAt
      - lastSentAt
      - notificationJobId
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
        version:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
        lastSentAt:
          type: string
          format: date-time
        notificationJobId:
          type:
          - string
          - 'null'
          format: uuid
    MarketReviewRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      - evidenceReference
      - reason
      - validUntil
      - confirmedMarketCode
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
          - revoked
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
        confirmedMarketCode:
          type: string
          minLength: 2
          maxLength: 16
    MarketReviewRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - marketCode
      - decision
      - evidenceReference
      - reason
      - reviewedBy
      - reviewedAt
      - validUntil
      - storeConfigVersion
      properties:
        id:
          type: string
          format: uuid
        marketCode:
          type: string
          minLength: 2
          maxLength: 16
        decision:
          type: string
          enum:
          - approved
          - rejected
          - revoked
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        reviewedBy:
          type: string
          format: uuid
        reviewedAt:
          type: string
          format: date-time
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
        storeConfigVersion:
          type: integer
          minimum: 1
    HealthStatus:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: alive
    AdminInvitationSummaryEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminInvitationSummary'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MarketReviewRecordEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/MarketReviewRecord'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    HealthStatusEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/HealthStatus'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BootstrapOwnerRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - displayName
      - password
      - locale
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
        locale:
          type: string
          enum:
          - zh-CN
          - zh-HK
          - en
    AcceptAdminInvitationRequest:
      type: object
      additionalProperties: false
      required:
      - invitationToken
      - newPassword
      properties:
        invitationToken:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
    AdminMfaSetupChallenge:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - nextAction
      - expiresAt
      properties:
        challengeId:
          type: string
          format: uuid
        nextAction:
          type: string
          const: enroll_mfa
        expiresAt:
          type: string
          format: date-time
    AuthorizeMfaEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      properties:
        currentPassword:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
        currentMfaCode:
          type: string
          minLength: 6
          maxLength: 32
          writeOnly: true
    StartMfaEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
      - challengeId
      properties:
        challengeId:
          type: string
          format: uuid
    ConfirmMfaEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - enrollmentId
      - code
      properties:
        challengeId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^\d{6}$
          writeOnly: true
    AdminMfaEnrollment:
      type: object
      additionalProperties: false
      required:
      - enrollmentId
      - expiresAt
      - totpSecret
      - provisioningUri
      properties:
        enrollmentId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        totpSecret:
          type: string
          pattern: ^[A-Z2-7]+$
          readOnly: true
          description: One-time TOTP provisioning secret; never log/cache. Store encrypted, not as a hash, to verify
            subsequent TOTP codes.
        provisioningUri:
          type: string
          format: uri
          pattern: ^otpauth://totp/
          readOnly: true
    AdminMfaEnrollmentConfirmed:
      type: object
      additionalProperties: false
      required:
      - session
      - recoveryCodes
      properties:
        session:
          $ref: '#/components/schemas/AdminSessionData'
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 20
            maxLength: 20
            readOnly: true
          description: Shown only on successful enrollment confirmation. Server stores only hashes; never return on
            session or staff reads.
    AdminSessionView:
      type: object
      additionalProperties: false
      required:
      - id
      - createdAt
      - lastSeenAt
      - idleExpiresAt
      - absoluteExpiresAt
      - current
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    AdminSessionRevoked:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - revokedAt
      properties:
        sessionId:
          type: string
          format: uuid
        revokedAt:
          type: string
          format: date-time
    AdminMfaSetupChallengeEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminMfaSetupChallenge'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminMfaEnrollmentEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminMfaEnrollment'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminMfaEnrollmentConfirmedEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminMfaEnrollmentConfirmed'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminSessionRevokedEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminSessionRevoked'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminAuthenticationChallengeEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          oneOf:
          - $ref: '#/components/schemas/AdminMfaChallenge'
          - $ref: '#/components/schemas/AdminMfaSetupChallenge'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminSessionListEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - items
          - nextCursor
          - hasMore
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminSessionView'
            nextCursor:
              type:
              - string
              - 'null'
              maxLength: 2048
            hasMore:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - displayName
      - locale
      - status
      - roleIds
      - mfaRequired
      - mfaEnabled
      - version
      - lastLoginAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          enum:
          - zh-CN
          - zh-HK
          - en
        status:
          type: string
          enum:
          - invited
          - active
          - suspended
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        mfaRequired:
          type: boolean
        mfaEnabled:
          type: boolean
        version:
          type: integer
          minimum: 1
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminSessionData:
      type: object
      additionalProperties: false
      required:
      - user
      - permissionCodes
      - mfaVerified
      - idleExpiresAt
      - absoluteExpiresAt
      - csrfToken
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
          properties:
            status:
              const: active
        permissionCodes:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_.]{1,99}$
          uniqueItems: true
        mfaVerified:
          type: boolean
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
          description: Session-bound CSRF token; never log or persist in analytics.
      allOf:
      - if:
          properties:
            user:
              properties:
                mfaRequired:
                  const: true
              required:
              - mfaRequired
          required:
          - user
        then:
          properties:
            mfaVerified:
              const: true
            user:
              properties:
                mfaEnabled:
                  const: true
    AdminMfaChallenge:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - nextAction
      - allowedMethods
      - expiresAt
      properties:
        challengeId:
          type: string
          format: uuid
        nextAction:
          type: string
          const: verify_mfa
        allowedMethods:
          type: array
          items:
            type: string
            enum:
            - totp
            - recovery_code
          minItems: 1
          uniqueItems: true
        expiresAt:
          type: string
          format: date-time
    PasswordResetAccepted:
      type: object
      additionalProperties: false
      required:
      - requestAccepted
      properties:
        requestAccepted:
          type: boolean
          const: true
    AdminSessionsRevoked:
      type: object
      additionalProperties: false
      required:
      - userId
      - revokedCount
      - revokedAt
      properties:
        userId:
          type: string
          format: uuid
        revokedCount:
          type: integer
          minimum: 0
        revokedAt:
          type: string
          format: date-time
    AdminRole:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - permissionCodes
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum:
          - owner
          - admin
          - preset
          - custom
          description: owner 为不可编辑的店主角色；admin/preset 为默认岗位权限包；custom 为自建角色。
        presetKey:
          type:
          - string
          - 'null'
          pattern: ^[a-z][a-z0-9_]{1,39}$
          description: 默认岗位权限包的稳定标识，角色改名后不变；自定义角色为 null。
        description:
          type:
          - string
          - 'null'
          maxLength: 500
        permissionCodes:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_.]{1,99}$
          uniqueItems: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MarketProfile:
      type: object
      additionalProperties: false
      required:
      - marketCode
      - enabled
      - eligibleProductIds
      - reviewStatus
      - reviewValidUntil
      properties:
        marketCode:
          type: string
          minLength: 2
          maxLength: 16
        enabled:
          type: boolean
        eligibleProductIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        reviewStatus:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - revoked
          - expired
        reviewValidUntil:
          type:
          - string
          - 'null'
          format: date-time
      allOf:
      - if:
          properties:
            enabled:
              const: true
          required:
          - enabled
        then:
          properties:
            reviewStatus:
              const: approved
    StoreConfiguration:
      type: object
      additionalProperties: false
      required:
      - displayName
      - locales
      - defaultLocale
      - baseCurrency
      - timezone
      - marketProfiles
      - featureFlags
      - brandAssets
      - version
      - updatedAt
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locales:
          type: array
          items:
            type: string
            enum:
            - zh-CN
            - zh-HK
            - en
          minItems: 1
          uniqueItems: true
        defaultLocale:
          type: string
          enum:
          - zh-CN
          - zh-HK
          - en
        baseCurrency:
          type: string
          pattern: ^[A-Z]{3}$
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          description: Valid IANA zone; server validates existence.
        marketProfiles:
          type: array
          items:
            $ref: '#/components/schemas/MarketProfile'
        featureFlags:
          type: object
          additionalProperties:
            type: boolean
        brandAssets:
          type: object
          additionalProperties: false
          required:
          - logoMediaId
          - faviconMediaId
          properties:
            logoMediaId:
              type:
              - string
              - 'null'
              format: uuid
            faviconMediaId:
              type:
              - string
              - 'null'
              format: uuid
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    AdminSessionEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminSessionData'
