              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminRoleListEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - items
          - nextCursor
          - hasMore
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminRole'
            nextCursor:
              type:
