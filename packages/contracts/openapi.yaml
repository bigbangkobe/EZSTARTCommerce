        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /storefront/checkout/shipping-methods:
    get:
      tags: [Checkout]
      operationId: listCheckoutShippingMethods
      summary: List delivery methods available for the guest cart and destination
      security: [{ GuestCartSession: [] }]
      parameters:
        - { name: countryCode, in: query, required: true,
            schema: { type: string, pattern: '^[A-Za-z]{2}$',
              description: Case-insensitive on input; the stored value is uppercased. } }
        - { name: regionCode, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: locale, in: query, required: false, schema: { type: string, maxLength: 10 } }
      responses:
        '200': { $ref: '#/components/responses/ShippingMethodsSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /storefront/checkout/quote:
    post:
      tags: [Checkout]
      operationId: createCheckoutQuote
      summary: Calculate an authoritative checkout quote
      security: [{ GuestCartSession: [], CsrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutQuoteRequest' }
      responses:
        '200': { $ref: '#/components/responses/QuoteSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /storefront/checkout/orders:
    post:
      tags: [Checkout]
      operationId: createOrderFromQuote
      summary: Create exactly one order from a confirmed quote
      security: [{ GuestCartSession: [], CsrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutOrderRequest' }
      responses:
        '201': { $ref: '#/components/responses/OrderCreatedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /storefront/checkout/orders/{orderId}/pay:
    post:
      tags: [Checkout]
      operationId: startOnlinePayment
      summary: Create or reuse the provider payment intent and return the hosted checkout URL
      description: >-
        Guest-cart scoped. Ownership is proved by the cart credential that created the order, not by
        the order id alone. The amount always comes from the order snapshot and the internal payment
        number is reused as the provider idempotency key, so retries never open a second charge.
        Offline methods (COD, manual transfer) are rejected with PAYMENT_METHOD_NOT_ONLINE.
      security: [{ GuestCartSession: [], CsrfToken: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { description: Provider rejected or failed the payment creation }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /storefront/analytics/events:
    post:
      tags: [Analytics]
      operationId: ingestAnalyticsEvents
      summary: Ingest first-party anonymous funnel events (no PII, consent-gated)
      x-authentication: public
      x-rate-limit: analytics-ingest
      x-csrf: required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsEventBatch' }
      responses:
        '202': { description: Events accepted (idempotent duplicates ignored) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /storefront/member/otp/request:
    post:
      tags: [Members]
      operationId: requestMemberOtp
      summary: Request an email OTP without revealing membership existence
      x-rate-limit: member-email-and-ip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202': { $ref: '#/components/responses/OtpChallengeAccepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /storefront/member/otp/verify:
    post:
      tags: [Members]
      operationId: verifyMemberOtp
      summary: Verify a one-time member code
      x-rate-limit: member-email-and-ip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /storefront/member/logout:
    post:
      tags: [Members]
      operationId: logoutMember
      summary: Revoke the current member session
      security: [{ MemberSession: [], CsrfToken: [] }]
      responses:
        '204': { description: Member session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /storefront/member/profile:
    get:
      tags: [Members]
      operationId: getMemberProfile
      summary: Get the authenticated member profile
      description: >-
        Returns the member identity, loyalty summary and the session-derived CSRF token.
        The token is read from the same origin only, so a reloaded page can still log out safely.
      security: [{ MemberSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /storefront/member/orders:
    get:
      tags: [Members]
      operationId: listMemberOrders
      summary: List order summaries for the authenticated member
      security: [{ MemberSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /storefront/member/points:
    get:
      tags: [Members]
      operationId: getMemberPoints
      summary: Get member points balance and ledger summary
      security: [{ MemberSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /storefront/member/coupons:
    get:
      tags: [Members]
      operationId: listMemberCoupons
      summary: List coupons assigned to the authenticated member
      security: [{ MemberSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /webhooks/payments/{provider}:
    post:
      tags: [Payments]
      operationId: receivePaymentWebhook
      summary: Receive, verify, de-duplicate and enqueue a provider webhook
      x-webhook-signature-validation: provider-adapter
      x-idempotency: provider-event-id
      parameters: [{ $ref: '#/components/parameters/ProviderCode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Provider-specific signed body; raw bytes must be retained for signature verification. }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Webhook body too large }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /webhooks/carriers/{carrierCode}:
    post:
      tags: [Orders]
      operationId: receiveCarrierWebhook
      summary: Receive a signed carrier status callback, de-duplicate it and advance fulfillment
      description: >-
        Public HMAC-authenticated callback. The carrier code is taken from the path and must have a
        pre-configured secret; the body is a closed set with no customer PII. A delivered callback
        only completes a parcel that was already dispatched by an authorized operator, and never
        changes payment status. The signature covers the Unix timestamp and the canonical JSON body.
      x-authentication: public
      x-webhook-signature-validation: hmac-sha256
      x-idempotency: carrier-event-id
      parameters:
        - { $ref: '#/components/parameters/CarrierCode' }
        - { $ref: '#/components/parameters/CarrierTimestamp' }
        - { $ref: '#/components/parameters/CarrierSignature' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarrierStatusEventRequest' }
      responses:
        '202': { $ref: '#/components/responses/CarrierWebhookAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Webhook body too large }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /admin/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Search and filter orders
      security: [{ AdminSession: [] }]
      x-permission: orders.read
      x-field-permissions: [customers.read_pii]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/SearchQuery' }]
      responses:
        '200': { $ref: '#/components/responses/OrderListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order snapshot and status history
      security: [{ AdminSession: [] }]
      x-permission: orders.read
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      responses:
        '200': { $ref: '#/components/responses/OrderDetailSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/orders/{id}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an eligible order
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: orders.cancel
      parameters: [{ $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCancelRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/orders/{id}/address-change:
    post:
      tags: [Orders]
      operationId: changeOrderAddress
      summary: Change an address before shipment after re-validating delivery and price
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: orders.address_change
      parameters: [{ $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderAddressChangeRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/orders/{id}/notes:
    post:
      tags: [Orders]
      operationId: addOrderNote
      summary: Add an internal order note
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: orders.update
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderNoteRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/orders/{id}/shipments:
    post:
      tags: [Orders]
      operationId: createShipment
      summary: Create a parcel containing a subset of order lines
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: shipments.manage
      parameters: [{ $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/shipments/{id}/dispatch:
    post:
      tags: [Orders]
      operationId: dispatchShipment
      summary: Mark parcel dispatched and commit shipped inventory quantities
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: shipments.manage
      parameters: [{ $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentDispatchRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/shipments/{id}/deliver:
    post:
      tags: [Orders]
      operationId: deliverShipment
      summary: Record delivery evidence; this does not collect COD payment
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: shipments.manage
      parameters: [{ $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentDeliverRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /admin/payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List payment ledger entries
      security: [{ AdminSession: [] }]
      x-permission: payments.read
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: orderId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: providerCode
          in: query
          required: false
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,31}$' }
      responses:
        '200': { $ref: '#/components/responses/PaymentListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/payments/{id}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Get a payment and its event history
      security: [{ AdminSession: [] }]
      x-permission: payments.read
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      responses:
        '200': { $ref: '#/components/responses/PaymentSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/payment-methods:
    get:
      tags: [Payments]
      operationId: listPaymentMethods
      summary: List payment methods with redacted credential status
      security: [{ AdminSession: [] }]
      x-permission: payment.config
      responses:
        '200': { $ref: '#/components/responses/PaymentMethodListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    patch:
      tags: [Payments]
      operationId: updatePaymentMethod
      summary: Configure or enable one approved payment adapter
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: payment.config
      x-mfa-required: true
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentMethodPatchRequest' }
      responses:
        '200': { $ref: '#/components/responses/PaymentMethodSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/payment-methods/{providerCode}/connection-test:
    post:
      tags: [Payments]
      operationId: testPaymentMethodConnection
      summary: Verify stored credentials against the provider without creating a payment
      description: >-
        Resolves the secret reference and calls the adapter's cheapest authenticated endpoint.
        Writes the outcome to connectionStatus so a misconfigured method stays invisible at
        checkout instead of failing real orders. Never returns credential material.
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: payment.config
      x-mfa-required: true
      parameters:
        - name: providerCode
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        - name: environment
          in: query
          required: false
          schema: { type: string, enum: [sandbox, production], default: production }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { description: Provider unreachable or rejected the credentials }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/orders/{id}/payment-result:
    post:
      tags: [Payments]
      operationId: recordOrderPaymentResult
      summary: Record a COD, manual-transfer or return outcome against an order payment
      description: >-
        Records money that has actually changed hands. The amount must equal the order total in
        the order currency; the request carries the order version it was based on. Unknown
        provider states cannot be forced to failed or succeeded here.
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: payments.collect
      parameters:
        - { $ref: '#/components/parameters/UuidId' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderPaymentResultRequest' }
      responses:
        '200': { $ref: '#/components/responses/PaymentResultSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/refunds:
    get:
      tags: [Payments]
      operationId: listRefunds
      summary: List refund ledger entries
      security: [{ AdminSession: [] }]
      x-permission: payments.read
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RefundStatus' }
        - name: orderId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: caseId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: paymentId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/RefundListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    post:
      tags: [Payments]
      operationId: createRefund
      summary: Request a refund without exceeding the refundable amount
      description: >-
        Money may only be refunded against a payment that actually settled. The amount is capped by
        the settled balance minus refunds already made or still in flight; the order total is not the
        limit. Requests carry an Idempotency-Key so a retry cannot book a second refund.
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: refunds.create
      x-mfa-required: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
