          type: object
          description: Operation-specific data object. Each operation references the DTO described in API_SPEC.md.
          additionalProperties: true
        meta:
          type: object
          additionalProperties: false
          required: [requestId]
          properties:
            requestId: { type: string, maxLength: 128 }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
    OtpChallengeEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/OtpChallenge' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OtpChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, challengeAccepted, resendAfterSeconds, expiresInSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        challengeAccepted: { type: boolean, const: true }
        resendAfterSeconds: { type: integer, minimum: 1 }
        expiresInSeconds: { type: integer, minimum: 1 }
    ProductEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AdminProduct' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ProductListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor, hasMore]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PublicProductEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PublicProduct' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PublicProductListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor, hasMore, total]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/PublicProduct' } }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
            # 与 items 同一套可售过滤下的总数：前台用它显示「已出现 N / 总数」的进度，避免只靠 hasMore 猜。
            total: { type: integer, minimum: 0 }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PublicCategoryEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
