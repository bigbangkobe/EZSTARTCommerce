      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor, hasMore]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminCoupon' } }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AdminCouponRedemption:
      type: object
      additionalProperties: false
      required: [id, orderId, publicOrderNumber, status, discountMinor, currency, customerRef,
        reservedAt, redeemedAt, releasedAt, expiresAt, ruleVersion]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        publicOrderNumber: { type: string }
        status: { type: string, enum: [reserved, redeemed, released, expired] }
        discountMinor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        customerRef:
          type: [string, 'null']
          description: First 8 hex characters of the instance-key HMAC. Opaque, not reversible, no contact data.
        reservedAt: { type: string, format: date-time }
        redeemedAt: { type: [string, 'null'], format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        ruleVersion: { type: [integer, 'null'], minimum: 1 }
    CouponRedemptionListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor, hasMore]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminCouponRedemption' } }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CouponFields:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[ \t]*[A-Za-z0-9][A-Za-z0-9_-]{0,79}[ \t]*$'
          description: Surrounding whitespace is trimmed and letters are uppercased before storage.
        discountType: { type: string, enum: [fixed, percent] }
        discountValue: { type: integer, minimum: 1, description: Fixed uses currency minor units; percent uses basis points, where 100 bps equals 1 percent and the maximum is 10000 bps. }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        minSubtotalMinor: { type: [integer, 'null'], minimum: 0 }
        totalLimit: { type: [integer, 'null'], minimum: 1 }
        perCustomerLimit: { type: [integer, 'null'], minimum: 1 }
        eligibleProductIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        eligibleCategoryIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        memberTierIds: { type: array, uniqueItems: true, items: { type: string, format: uuid },
          description: Member-tier restriction. Tiers must exist and be active; only members holding an allowed tier may redeem. }
        refundPolicy: { type: string, enum: [none, restore], default: none,
          description: restore returns the coupon quota through a new return record once the order is fully refunded; it never rewrites the original usage row. }
        status: { type: string, enum: [active, disabled], default: active }
      allOf:
        - if:
            properties:
              discountType: { const: percent }
            required: [discountType]
          then:
            properties:
              discountValue: { maximum: 10000 }
    CouponWriteRequest:
      allOf:
        - { $ref: '#/components/schemas/CouponFields' }
        - type: object
          required: [code, discountType, discountValue, validFrom, validUntil]
    CouponPatchRequest:
      allOf: [{ $ref: '#/components/schemas/CouponFields' }]
      minProperties: 1
      description: Partial update; discountType and discountValue are validated together.
    CouponBatchRequest:
      type: object
      additionalProperties: false
      required: [couponId, channel]
      properties:
        couponId: { type: string, format: uuid }
        recipientMemberIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        recipientFilter: { type: object, additionalProperties: true }
        channel: { type: string, enum: [account_only, email, sms] }
        templateId: { type: [string, 'null'], format: uuid }
    CouponBatchIssueRequest:
      type: object
      additionalProperties: false
      required: [confirmedRecipientCount]
      properties:
        confirmedRecipientCount: { type: integer, minimum: 0 }
    CouponBatch:
      type: object
      additionalProperties: false
      required: [id, couponId, channel, recipientCount, recipientMemberIds, status, idempotencyKey, createdAt]
      properties:
        id: { type: string, format: uuid }
        couponId: { type: string, format: uuid }
        channel: { type: string, enum: [account_only, email, sms] }
        recipientCount: { type: integer, minimum: 0 }
        recipientMemberIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        status: { type: string, enum: [pending, issued] }
        confirmedRecipientCount: { type: [integer, 'null'], minimum: 0 }
        templateId: { type: [string, 'null'], format: uuid }
        idempotencyKey: { type: string, minLength: 1 }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        issuedAt: { type: [string, 'null'], format: date-time }
    InventoryAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [variantId, delta, reason, expectedVersion]
      properties:
        variantId: { type: string, format: uuid }
        delta:
          type: integer
          minimum: -100000
          maximum: 100000
          not: { const: 0 }
          description: Signed change. Negative values remove stock but never below reserved.
        reasonCode: { type: [string, 'null'], maxLength: 80, pattern: '^[a-z0-9][a-z0-9_]{0,79}$' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        reference: { type: [string, 'null'], maxLength: 200 }
        expectedVersion:
          type: integer
          minimum: 0
          description: Inventory version the operator saw; 0 means the SKU has no stock row yet.
    InventoryThresholdsPatchRequest:
      type: object
      additionalProperties: false
      required: [variantId, lowStockLevel, expectedVersion]
      properties:
        variantId: { type: string, format: uuid }
        lowStockLevel: { type: integer, minimum: 0, maximum: 1000000 }
        expectedVersion:
          type: integer
          minimum: 0
          description: 0 creates the threshold; otherwise it must equal the version that was read.
    InventoryMovementType:
      type: string
      enum: [return_restock, return_damaged, return_quarantine, return_scrap, adjustment]
    InventoryLowStockState:
      type: string
      enum: [ok, low, out_of_stock]
    AdminInventoryItem:
      type: object
      additionalProperties: false
      required: [variantId, sku, productId, productName, productStatus, variantStatus, onHand, reserved,
        available, lowStockLevel, lowStockVersion, lowStockState, version, updatedAt]
      properties:
        variantId: { type: string, format: uuid }
        sku: { type: string, maxLength: 64 }
        productId: { type: string, format: uuid }
        productName: { type: string, maxLength: 200 }
        productStatus: { type: string }
        variantStatus: { type: string }
        onHand: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        available: { type: integer }
        lowStockLevel: { type: integer, minimum: 0 }
        lowStockVersion:
          type: integer
          minimum: 0
          description: Version of the threshold row; 0 means no threshold was ever set.
        lowStockState: { $ref: '#/components/schemas/InventoryLowStockState' }
        version: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    AdminStockMovement:
      type: object
      additionalProperties: false
      required: [id, variantId, type, quantity, stockDelta, onHandAfter, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/InventoryMovementType' }
        quantity: { type: integer, minimum: 1 }
        stockDelta: { type: integer }
        onHandAfter: { type: [integer, 'null'], minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        reasonCode: { type: [string, 'null'], maxLength: 80 }
        reference: { type: [string, 'null'], maxLength: 200 }
        orderId: { type: [string, 'null'], format: uuid }
        caseId: { type: [string, 'null'], format: uuid }
        actorId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    AdminInventoryThreshold:
      type: object
      additionalProperties: false
      required: [variantId, lowStockLevel, version, updatedAt]
      properties:
        variantId: { type: string, format: uuid }
        lowStockLevel: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        updatedBy: { type: [string, 'null'], format: uuid }
        updatedAt: { type: string, format: date-time }
    InventoryListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor, hasMore]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminInventoryItem' } }
            nextCursor: { type: [string, 'null'], maxLength: 64 }
            hasMore: { type: boolean }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    InventoryMovementListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor, hasMore]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminStockMovement' } }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    InventoryThresholdListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor, hasMore]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminInventoryThreshold' } }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    InventoryAdjustmentEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [movement, variantId, onHand, reserved, available, version, lowStockLevel, replay]
          properties:
            movement: { $ref: '#/components/schemas/AdminStockMovement' }
            variantId: { type: string, format: uuid }
            onHand: { type: integer, minimum: 0 }
            reserved: { type: integer, minimum: 0 }
            available: { type: integer }
            version: { type: integer, minimum: 0 }
            lowStockLevel: { type: integer, minimum: 0 }
            replay: { type: boolean, description: True when the same Idempotency-Key returned the original movement. }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    InventoryThresholdEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AdminInventoryThreshold' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    NotificationSettingsPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        channels: { type: array, items: { $ref: '#/components/schemas/NotificationChannelInput' } }
        templates: { type: array, items: { $ref: '#/components/schemas/NotificationTemplateInput' } }
    NotificationChannelInput:
      type: object
      additionalProperties: false
      required: [channel, enabled]
      properties:
        channel: { type: string, enum: [email, sms, whatsapp] }
        enabled: { type: boolean }
        credentialRef: { type: [string, 'null'], maxLength: 256, writeOnly: true }
    NotificationTemplateInput:
      type: object
      additionalProperties: false
      required: [eventType, purpose, locale, channel, subject, body, enabled]
      properties:
        eventType: { type: string, maxLength: 100 }
        purpose: { type: string, enum: [transactional, marketing] }
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        channel: { type: string, enum: [email, sms, whatsapp] }
        subject: { type: [string, 'null'], maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        enabled: { type: boolean }
    AnalyticsEventInput:
      type: object
      additionalProperties: false
      required: [eventId, sessionId, eventName, occurredAt, schemaVersion, consentState]
      properties:
        eventId: { type: string, minLength: 16, maxLength: 128, description: Client-generated idempotency key (UUID) }
        sessionId: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$', description: Random anonymous session id; not derived from any PII }
        eventName: { type: string, enum: [page_view, view_item, add_to_cart, begin_checkout, section_impression, section_click] }
        occurredAt: { type: string, format: date-time }
        schemaVersion: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
        consentState: { type: string, enum: [granted, denied, unknown] }
        pageKey: { type: string, maxLength: 128 }
        locale: { type: string, maxLength: 32 }
        deviceClass: { type: string, enum: [desktop, mobile, tablet] }
        marketCode: { type: string, maxLength: 32 }
        variantId: { type: string, maxLength: 128 }
        interactionId: { type: string, maxLength: 128 }
        source: { type: string, maxLength: 128, description: Anonymous UTM source bucket, never a full URL }
        sectionId: { type: string, maxLength: 128, description: Section instance id on a page; stable within a publish version, no HTML or URL }
        sectionKey: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{1,63}$', description: Stable logical section key shared across publish versions }
        placementId: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$', description: Optional placement slot inside a section (e.g. product card slot) }
        publishVersionId: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$', description: Content release marker the theme rendered; used for version filtering }
        environment: { type: string, enum: [production, preview, staff, sandbox], description: Traffic environment; only production counts toward merchandising metrics }
        trafficClass: { type: string, enum: [human, suspected_bot], description: Anonymous traffic class; suspected bots are excluded from metrics but kept for audit }
    AnalyticsEventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/AnalyticsEventInput' }
    ReportExportRequest:
      type: object
      additionalProperties: false
      required: [reportKey, from, to, timezone, format]
      properties:
        reportKey: { $ref: '#/components/schemas/ReportKey' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timezone: { type: string, description: IANA time zone identifier }
        format: { type: string, enum: [csv, xlsx] }
        filters: { type: object, additionalProperties: true }
        includePii: { type: boolean, default: false }
    ReportKey:
      type: string
      description: Server-computed aggregate report. PII is never included in report rows.
      enum: [sales_summary, orders_by_status, orders_by_payment, orders_by_method, product_sales, inventory, coupons, members, funnel, placement]
    ReportRow:
      type: object
      additionalProperties: false
      required: [dimensions, metrics]
      properties:
        dimensions:
          type: object
          additionalProperties: { type: [string, 'null'] }
          propertyNames: { enum: [day, status, method, sku, productName, code, tier, market, currency, locale, step, device, source, sectionKey, sectionId, page, version] }
          description: Dimension keys (status, method, sku, step, device, source, sectionKey, ...) with their bucket value. Only non-PII dimension keys are allowed; funnel uses step/device/source, placement uses sectionKey/sectionId/page/version.
        metrics:
          type: object
          additionalProperties: { type: number }
          description: Numeric metrics in minor units or counts; unit is defined by the metric definition.
    ReportResult:
      type: object
      additionalProperties: false
      required: [reportKey, metricDefinitionVersion, generatedAt, from, to, timezone, currencies, filters, totals, rows, coverage]
      properties:
        reportKey: { $ref: '#/components/schemas/ReportKey' }
        metricDefinitionVersion: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
        generatedAt: { type: string, format: date-time }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timezone: { type: string, description: IANA time zone used to group timestamps into local days }
        currencies:
          type: array
          description: ISO 4217 codes present in the result; amounts are never added across currencies.
          items: { type: string }
        filters: { type: object, additionalProperties: true }
        totals:
          type: object
          additionalProperties: { type: number }
          description: Overall metrics for the selected range; amounts are in minor units.
        rows:
          type: array
          items: { $ref: '#/components/schemas/ReportRow' }
        coverage: { $ref: '#/components/schemas/ReportCoverage' }
    ReportCoverage:
      type: object
      additionalProperties: false
      required: [sourceOrderCount, lastDataAt, complete]
      properties:
        sourceOrderCount: { type: integer, minimum: 0 }
        lastDataAt: { type: [string, 'null'], format: date-time }
        complete: { type: boolean }
        note: { type: string, maxLength: 500 }
    ReportEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ReportResult' }
        meta:
          type: object
          additionalProperties: false
          required: [requestId]
          properties:
            requestId: { type: string, maxLength: 128 }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
    ReportExport:
      type: object
      additionalProperties: false
      required: [id, reportKey, format, status, includePii, filters, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        reportKey: { $ref: '#/components/schemas/ReportKey' }
        format: { type: string, enum: [csv, xlsx] }
        status: { type: string, enum: [pending, completed, failed] }
        includePii: { type: boolean }
        filters: { type: object, additionalProperties: true }
        fileName: { type: [string, 'null'], maxLength: 200 }
        rowCount: { type: [integer, 'null'], minimum: 0 }
        errorCode: { type: [string, 'null'], maxLength: 100 }
        downloadUrl: { type: [string, 'null'], description: Short-lived relative URL, present only when completed. }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
    ReportExportEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ReportExport' }
        meta:
          type: object
          additionalProperties: false
          required: [requestId]
          properties:
            requestId: { type: string, maxLength: 128 }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
    BackupRequest:
      type: object
      additionalProperties: false
      required: [includeMedia, reason]
      properties:
        includeMedia: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    AfterSalesCreateRequest:
      type: object
      additionalProperties: false
      required: [orderId, caseType, items, reason]
      properties:
        orderId: { type: string, format: uuid }
        caseType: { type: string, enum: [cancel, refund, return, exchange] }
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [orderItemId, quantity]
            properties:
              orderItemId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 99 }
        reasonCode: { type: [string, 'null'], maxLength: 80 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        requestedRefundMinor: { type: [integer, 'null'], minimum: 0 }
    ReturnReceiptRequest:
      type: object
      additionalProperties: false
      required: [receivedAt, items]
      properties:
        receivedAt: { type: string, format: date-time }
        reference: { type: [string, 'null'], maxLength: 200 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [orderItemId, quantity]
            properties:
              orderItemId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 99 }
    ReturnInspectionRequest:
      type: object
      additionalProperties: false
      required: [items, reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [orderItemId, quantity, disposition]
            properties:
              orderItemId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 99 }
              disposition: { type: string, enum: [sellable, damaged, quarantine, scrap] }
              note: { type: [string, 'null'], maxLength: 1000 }
    AfterSalesRefundRequest:
      type: object
      additionalProperties: false
      required: [amountMinor, currency, reason]
      properties:
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reasonCode: { type: [string, 'null'], maxLength: 80 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    AfterSalesCaseType:
      type: string
      enum: [cancel, refund, return, exchange]
    AfterSalesCaseStatus:
      type: string
      enum: [submitted, under_review, approved, rejected, needs_information, return_in_transit,
        received_inspection, refund_pending, refunded, replacement_sent, completed, closed]
      description: >-
        Cases only move forward. A cancellation case closes as soon as the order is cancelled because
        there is nothing left to fulfil; refunds, returns and exchanges keep their own timeline.
    RefundStatus:
      type: string
      enum: [requested, approved, processing, refunded, failed, rejected, cancelled, unknown]
      description: >-
        Unknown means the provider has not answered yet; it can only be resolved by a provider query
        or webhook, never by an operator forcing a state.
    ReturnShipmentRequest:
      type: object
      additionalProperties: false
      required: [trackingNumber]
      properties:
        carrierCode: { type: [string, 'null'], maxLength: 80 }
        carrierName: { type: [string, 'null'], maxLength: 120 }
        trackingNumber: { type: string, minLength: 1, maxLength: 160 }
        shippedAt: { type: [string, 'null'], format: date-time }
        reference: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 1000 }
    RefundExecuteRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        reference:
          type: [string, 'null']
          maxLength: 200
          description: Payout proof for offline channels (bank slip, cash receipt); required for them.
        occurredAt: { type: [string, 'null'], format: date-time }
    AdminRefund:
      type: object
      additionalProperties: false
      required: [id, publicRefundNumber, orderId, publicOrderNumber, paymentId, publicPaymentNumber,
        channel, providerCode, environment, amountMinor, currency, status, reason, requestedBy,
        version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        publicRefundNumber: { type: string, pattern: '^REF-[0-9]{8}-[A-Z0-9]{6}$' }
        orderId: { type: string, format: uuid }
        publicOrderNumber: { type: string, maxLength: 64 }
        paymentId: { type: string, format: uuid }
        publicPaymentNumber: { type: string, pattern: '^PAY-[0-9]{8}-[A-Z0-9]{6}$' }
        caseId: { type: [string, 'null'], format: uuid }
        channel: { type: string, enum: [cod, manual, online] }
        providerCode: { type: string, pattern: '^[a-z][a-z0-9_]{1,31}$' }
        environment: { type: string, enum: [sandbox, production] }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { $ref: '#/components/schemas/RefundStatus' }
        reasonCode: { type: [string, 'null'], maxLength: 80 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        requestedBy: { type: string, format: uuid }
        approvedBy: { type: [string, 'null'], format: uuid }
        executedBy: { type: [string, 'null'], format: uuid }
        approvedAt: { type: [string, 'null'], format: date-time }
        executedAt: { type: [string, 'null'], format: date-time }
        reference: { type: [string, 'null'], maxLength: 200 }
        externalRefundId: { type: [string, 'null'], maxLength: 160 }
        failureCode: { type: [string, 'null'], maxLength: 80 }
        failureMessage: { type: [string, 'null'], maxLength: 1000 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, type, toStatus, source, occurredAt]
            properties:
              id: { type: string, format: uuid }
              type: { type: string, enum: [requested, approved, rejected, executed, failed, cancelled, unknown] }
              fromStatus: { type: [string, 'null'] }
              toStatus: { $ref: '#/components/schemas/RefundStatus' }
              source: { type: string, enum: [admin, system, provider] }
              actorId: { type: [string, 'null'], format: uuid }
              occurredAt: { type: string, format: date-time }
    RefundEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AdminRefund' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    RefundListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor, hasMore]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminRefund' } }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AdminAfterSalesItem:
      type: object
      additionalProperties: false
      required: [orderItemId, sku, productName, orderedQuantity, requestedQuantity, receivedQuantity,
        inspectedQuantity]
      properties:
        orderItemId: { type: string, format: uuid }
        sku: { type: string, maxLength: 120 }
        productName: { type: string, maxLength: 200 }
        variantName: { type: [string, 'null'], maxLength: 200 }
        orderedQuantity: { type: integer, minimum: 1 }
        requestedQuantity: { type: integer, minimum: 1 }
        approvedQuantity: { type: [integer, 'null'], minimum: 0 }
        amountMinor: { type: [integer, 'null'], minimum: 0 }
        disposed: { type: [string, 'null'], enum: [sellable, damaged, quarantine, scrap, null] }
        receivedQuantity: { type: integer, minimum: 0 }
        inspectedQuantity: { type: integer, minimum: 0 }
    AdminAfterSalesCase:
      type: object
      additionalProperties: false
      required: [id, publicCaseNumber, orderId, publicOrderNumber, caseType, status, reason, source,
        requestedRefundMinor, approvedRefundMinor, refundedMinor, pendingRefundMinor, refundableMinor,
        currency, orderStatus, paymentStatus, orderTotalMinor, version, createdAt, updatedAt,
        items, refunds, returns, receipts, inspections, events]
      properties:
        id: { type: string, format: uuid }
        publicCaseNumber: { type: string, pattern: '^AS-[0-9]{8}-[A-Z0-9]{6}$' }
        orderId: { type: string, format: uuid }
        publicOrderNumber: { type: string, maxLength: 64 }
        caseType: { $ref: '#/components/schemas/AfterSalesCaseType' }
        status: { $ref: '#/components/schemas/AfterSalesCaseStatus' }
        reasonCode: { type: [string, 'null'], maxLength: 80 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        source: { type: string, enum: [admin, customer] }
        requestedRefundMinor: { type: [integer, 'null'], minimum: 0 }
        approvedRefundMinor: { type: [integer, 'null'], minimum: 0 }
        refundedMinor: { type: integer, minimum: 0 }
        pendingRefundMinor: { type: integer, minimum: 0 }
        refundableMinor: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        orderStatus:
          type: string
          enum: [pending_payment, awaiting_confirmation, confirmed, processing, partially_shipped,
            shipped, completed, cancelled, on_hold]
        paymentStatus:
          type: string
          enum: [created, requires_action, processing, succeeded, failed, cancelled, unknown,
            cod_due, collected, rejected, returned]
        orderTotalMinor: { type: integer, minimum: 0 }
        contactMasked: { type: [string, 'null'], maxLength: 200 }
        ownerId: { type: [string, 'null'], format: uuid }
        approvedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'], format: uuid }
        rejectedAt: { type: [string, 'null'], format: date-time }
        rejectReason: { type: [string, 'null'], maxLength: 1000 }
        closedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminAfterSalesItem' }
        refunds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, publicRefundNumber, status, amountMinor, currency, channel, createdAt]
            properties:
              id: { type: string, format: uuid }
              publicRefundNumber: { type: string, pattern: '^REF-[0-9]{8}-[A-Z0-9]{6}$' }
              status: { $ref: '#/components/schemas/RefundStatus' }
              amountMinor: { type: integer, minimum: 1 }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              channel: { type: string, enum: [cod, manual, online] }
              createdAt: { type: string, format: date-time }
              executedAt: { type: [string, 'null'], format: date-time }
        returns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, status]
            properties:
              id: { type: string, format: uuid }
              status: { type: string, enum: [in_transit, received] }
              carrierCode: { type: [string, 'null'], maxLength: 80 }
              carrierName: { type: [string, 'null'], maxLength: 120 }
              trackingNumber: { type: [string, 'null'], maxLength: 160 }
              shippedAt: { type: [string, 'null'], format: date-time }
              receivedAt: { type: [string, 'null'], format: date-time }
              reference: { type: [string, 'null'], maxLength: 200 }
        receipts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, receivedAt, items]
            properties:
              id: { type: string, format: uuid }
              receivedAt: { type: string, format: date-time }
              reference: { type: [string, 'null'], maxLength: 200 }
              items:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [orderItemId, quantity]
                  properties:
                    orderItemId: { type: string, format: uuid }
                    quantity: { type: integer, minimum: 1 }
        inspections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, orderItemId, quantity, disposition, createdAt]
            properties:
              id: { type: string, format: uuid }
              orderItemId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              disposition: { type: string, enum: [sellable, damaged, quarantine, scrap] }
              note: { type: [string, 'null'], maxLength: 1000 }
              actorId: { type: [string, 'null'], format: uuid }
              createdAt: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, type, toStatus, createdAt]
            properties:
              id: { type: string, format: uuid }
              type: { type: string, enum: [created, approved, rejected, return_registered, received,
                inspected, refund_requested, refunded, closed] }
              fromStatus: { type: [string, 'null'] }
              toStatus: { $ref: '#/components/schemas/AfterSalesCaseStatus' }
              note: { type: [string, 'null'], maxLength: 1000 }
              actorId: { type: [string, 'null'], format: uuid }
              createdAt: { type: string, format: date-time }
        contact:
          type: object
          additionalProperties: false
          description: Present only for sessions holding customers.read_pii.
          required: [email, phone, fullName]
          properties:
            email: { type: [string, 'null'], maxLength: 320 }
            phone: { type: [string, 'null'], maxLength: 40 }
            fullName: { type: [string, 'null'], maxLength: 200 }
    AfterSalesCaseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AdminAfterSalesCase' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AfterSalesCaseListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor, hasMore]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminAfterSalesCase' } }
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
