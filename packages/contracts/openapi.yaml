      type: object
      additionalProperties: false
      required: [jobId, fileSha256, mappingVersion, totalRows, validRows, invalidRows, previewRows]
      properties:
        jobId: { type: string, format: uuid }
        fileSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        mappingVersion: { type: integer, minimum: 1 }
        totalRows: { type: integer, minimum: 0 }
        validRows: { type: integer, minimum: 0 }
        invalidRows: { type: integer, minimum: 0 }
        newCount: { type: integer, minimum: 0 }
        updateCount: { type: integer, minimum: 0 }
        skipCount: { type: integer, minimum: 0 }
        previewRows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rowNumber, action, errors, warnings]
            properties:
              rowNumber: { type: integer, minimum: 1 }
              sku: { type: [string, 'null'], maxLength: 64 }
              action: { type: string, enum: [create, update, skip, reject] }
              changes: { type: array, items: { type: object, additionalProperties: true } }
              errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
              warnings: { type: array, items: { type: string, maxLength: 500 } }
    MoneyBreakdown:
      type: object
      additionalProperties: false
      required: [currency, subtotalMinor, discountMinor, shippingMinor, taxMinor, totalMinor]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotalMinor: { type: integer, minimum: 0 }
        discountMinor: { type: integer, minimum: 0 }
        shippingMinor: { type: integer, minimum: 0 }
        taxMinor: { type: integer, minimum: 0 }
        totalMinor: { type: integer, minimum: 0 }
    Cart:
      type: object
      additionalProperties: false
      required: [cartId, currency, locale, itemCount, subtotalMinor, items, warnings, expiresAt]
      description: Guest cart. Prices and availability are recomputed on every read; the client never supplies them.
      properties:
        cartId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        locale: { type: [string, 'null'] }
        itemCount: { type: integer, minimum: 0 }
        subtotalMinor: { type: integer, minimum: 0, description: Sum of currently sellable lines only. }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        warnings: { type: array, items: { type: string, maxLength: 120 } }
        expiresAt: { type: string, format: date-time }
    CartLine:
      type: object
      additionalProperties: false
      required: [id, variantId, sku, productName, variantName, quantity, unitPriceMinor, lineSubtotalMinor, available, availableQuantity]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        sku: { type: string, maxLength: 64 }
        productName: { type: string, maxLength: 160 }
        variantName: { type: [string, 'null'], maxLength: 160 }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPriceMinor: { type: integer, minimum: 0 }
        lineSubtotalMinor: { type: integer, minimum: 0 }
        available: { type: boolean, description: False when the variant is no longer sellable or stock fell below the line quantity. }
        availableQuantity: { type: integer, minimum: 0 }
    CheckoutQuote:
      type: object
      additionalProperties: false
      required: [quoteId, version, expiresAt, lines, shippingMethod, couponSummary, ruleVersions, warnings, currency, subtotalMinor, discountMinor, shippingMinor, taxMinor, totalMinor, pointsRequested, pointsRedeemed, pointsValueMinor, pointsRuleVersion]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotalMinor: { type: integer, minimum: 0 }
        discountMinor: { type: integer, minimum: 0 }
        shippingMinor: { type: integer, minimum: 0 }
        taxMinor: { type: integer, minimum: 0 }
        totalMinor: { type: integer, minimum: 0 }
        pointsRequested: { type: integer, minimum: 0, description: Points the customer asked to use before server-side capping. }
        pointsRedeemed: { type: integer, minimum: 0, description: Points actually frozen into this immutable quote. }
        pointsValueMinor: { type: integer, minimum: 0, description: Merchandise amount covered by the redeemed points. }
        pointsRuleVersion: { type: [string, 'null'], description: Conversion rule frozen into the quote. }
        quoteId: { type: string, format: uuid }
        version: { type: integer, minimum: 1, description: Immutable quote revision echoed as confirmedQuoteVersion when ordering. }
        expiresAt: { type: string, format: date-time }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/QuoteLine' } }
        shippingMethod: { type: object, additionalProperties: false, required: [code, name], properties: { code: { type: string }, name: { type: string }, estimatedMinDays: { type: [integer, 'null'] }, estimatedMaxDays: { type: [integer, 'null'] } } }
        couponSummary: { type: [object, 'null'], additionalProperties: false, properties: { codeMasked: { type: string }, discountMinor: { type: integer, minimum: 0 } } }
        ruleVersions: { type: object, additionalProperties: false, required: [price, promotion, shipping, tax], properties: { price: { type: string }, promotion: { type: string }, shipping: { type: string }, tax: { type: [string, 'null'] } } }
        warnings: { type: array, items: { type: string, maxLength: 500 } }
        paymentMethods:
          type: array
          description: >-
            Payment methods selectable for this cart, already narrowed by each line's
            allowed-payment channels. Empty means the cart cannot be checked out as-is.
          items:
            type: object
            additionalProperties: false
            required: [code, channel, label]
            properties:
              code: { type: string, maxLength: 40 }
              channel: { type: string, enum: [cod, manual, online] }
              label: { type: string, maxLength: 80 }
              instructions: { type: [string, 'null'], maxLength: 2000 }
    QuoteLine:
      type: object
      additionalProperties: false
      required: [variantId, sku, quantity, unitPriceMinor, lineSubtotalMinor, lineDiscountMinor, lineTotalMinor]
      properties:
        productName: { type: string, maxLength: 160 }
        variantName: { type: [string, 'null'], maxLength: 160 }
        variantId: { type: string, format: uuid }
        sku: { type: string, maxLength: 64 }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPriceMinor: { type: integer, minimum: 0 }
        lineSubtotalMinor: { type: integer, minimum: 0 }
        lineDiscountMinor: { type: integer, minimum: 0 }
        lineTotalMinor: { type: integer, minimum: 0 }
    CheckoutOrderCreated:
      type: object
      additionalProperties: false
      required: [orderId, publicOrderNumber, orderStatus, paymentStatus, currency, totalMinor, paymentAction, pointsRedeemed, pointsValueMinor]
      properties:
        orderId: { type: string, format: uuid }
        publicOrderNumber: { type: string, maxLength: 64 }
        orderStatus: { type: string, enum: [pending_payment, awaiting_confirmation] }
        paymentStatus: { type: string, enum: [created, requires_action, processing, unknown, cod_due] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        totalMinor: { type: integer, minimum: 0 }
        pointsRedeemed: { type: integer, minimum: 0 }
        pointsValueMinor: { type: integer, minimum: 0 }
        paymentAction: { $ref: '#/components/schemas/PaymentAction' }
    PaymentAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [none, redirect, instructions] }
        redirectUrl: { type: [string, 'null'], format: uri }
        instructions: { type: [string, 'null'], maxLength: 2000 }
    WorkbenchSummary:
      type: object
      additionalProperties: false
      required: [generatedAt, orders, recentOrders]
      properties:
        generatedAt: { type: string, format: date-time }
        orders:
          type: object
          additionalProperties: false
          required: [awaitingConfirmation, awaitingDispatch, prepaidUnsettled]
          properties:
            awaitingConfirmation: { type: integer, minimum: 0 }
            awaitingDispatch: { type: integer, minimum: 0 }
            prepaidUnsettled: { type: integer, minimum: 0 }
        aftersales:
          description: Null when the actor lacks aftersales.read.
          type: [object, 'null']
          additionalProperties: false
          required: [open]
          properties:
            open: { type: integer, minimum: 0 }
        inventory:
          description: Null when the actor lacks inventory.read.
          type: [object, 'null']
          additionalProperties: false
          required: [lowStock]
          properties:
            lowStock: { type: integer, minimum: 0 }
        recentOrders:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/OrderSummary' }
    WorkbenchEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/WorkbenchSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OrderSummary:
      type: object
      additionalProperties: false
      required: [id, publicOrderNumber, orderStatus, paymentStatus, currency, totalMinor, createdAt]
      properties:
        id: { type: string, format: uuid }
        publicOrderNumber: { type: string, maxLength: 64 }
        orderStatus: { type: string }
        paymentStatus: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        totalMinor: { type: integer, minimum: 0 }
        contactMasked: { type: [string, 'null'], maxLength: 254 }
        createdAt: { type: string, format: date-time }
    AdminOrder:
      type: object
      additionalProperties: false
      required: [id, publicOrderNumber, orderStatus, paymentStatus, fulfillmentStatus, currency, totalMinor, version, lines, shipments, statusHistory, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        publicOrderNumber: { type: string, maxLength: 64 }
        orderStatus: { type: string, enum: [pending_payment, awaiting_confirmation, confirmed, processing, partially_shipped, shipped, completed, cancelled, on_hold] }
        paymentStatus: { type: string, enum: [created, requires_action, processing, succeeded, failed, cancelled, unknown, cod_due, collected, rejected, returned] }
        fulfillmentStatus: { type: string, enum: [unfulfilled, preparing, partially_fulfilled, fulfilled, delivered, exception] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotalMinor: { type: integer, minimum: 0 }
        discountMinor: { type: integer, minimum: 0 }
        shippingMinor: { type: integer, minimum: 0 }
        taxMinor: { type: integer, minimum: 0 }
        totalMinor: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1, description: Current optimistic-concurrency version for order actions. }
        locale: { type: string, maxLength: 16 }
        marketCode: { type: string, maxLength: 8 }
        paymentMethodCode: { type: string, maxLength: 40 }
        requiresPrepayment:
          type: boolean
          description: >-
            Frozen at checkout: no line in this order allows cash on delivery, so the
            order cannot be dispatched before a settled payment exists unless an
            override reason is supplied.
        dispatchOverrideReason: { type: [string, 'null'], maxLength: 500 }
        customerNote: { type: [string, 'null'], maxLength: 1000 }
        placedAt: { type: string, format: date-time }
        lines: { type: array, items: { type: object, additionalProperties: true } }
        addressSnapshot: { type: [object, 'null'], additionalProperties: true }
        contact: { type: object, additionalProperties: true, description: Contact fields are masked unless customers.read_pii is granted. }
        shippingMethod: { type: object, additionalProperties: true }
        cancellation: { type: [object, 'null'], additionalProperties: true }
        shipments: { type: array, items: { type: object, additionalProperties: true } }
        statusHistory: { type: array, items: { type: object, additionalProperties: true } }
        notes: { type: array, items: { type: object, additionalProperties: true } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string, minLength: 1, maxLength: 80 }
            message: { type: string, minLength: 1, maxLength: 500 }
            fieldErrors:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
            requestId: { type: string, maxLength: 128 }
            currentVersion: { type: [integer, 'null'], minimum: 1 }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string, maxLength: 256 }
        locale: { type: [string, 'null'], maxLength: 16 }
        code: { type: string, maxLength: 80 }
        message: { type: string, maxLength: 500 }
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        # 键名沿用 email 以兼容既有调用方，但不再限定邮箱格式：一客户一实例，
        # 账号名由店主自定（如 admin），不需要真实邮箱。
        email: { type: string, minLength: 1, maxLength: 254 }
        # 登录只判断凭据是否匹配，不套用「设置密码」的强度策略。否则策略调整后，
        # 历史短口令会永远登不进去（校验发生在比对哈希之前）。
        password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, minLength: 6, maxLength: 32, writeOnly: true }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: 账号名（历史上为邮箱）。与登录一致，不强制邮箱格式。
    PasswordResetCompleteRequest:
      type: object
      additionalProperties: false
      required: [resetToken, newPassword]
      properties:
        resetToken: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
        newPassword: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
    AdminUserInviteRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, roleIds, locale]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: 账号名。可省略邮箱格式；带 password 时为直建账号，否则按邀请流程处理。
        displayName: { type: string, minLength: 1, maxLength: 120 }
        roleIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true
          description: 初始密码。提供时直接建为可登录账号并置 mustChangePassword；省略时走邮件邀请。
    AdminUserPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [active, suspended] }
        roleIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
    RoleWriteRequest:
      type: object
      additionalProperties: false
      required: [name, permissionCodes]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 500 }
        permissionCodes: { type: array, uniqueItems: true, items: { type: string, pattern: '^[a-z][a-z0-9_.]{1,99}$' } }
    RolePatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 500 }
        permissionCodes: { type: array, uniqueItems: true, items: { type: string, pattern: '^[a-z][a-z0-9_.]{1,99}$' } }
    StoreConfigPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        locales: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [zh-CN, zh-HK, en] } }
        defaultLocale: { type: string, enum: [zh-CN, zh-HK, en] }
        baseCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        timezone: { type: string, description: IANA time zone identifier }
        marketProfiles: { type: array, items: { $ref: '#/components/schemas/MarketProfileInput' } }
        featureFlags: { type: object, additionalProperties: { type: boolean } }
        brandAssets: { type: object, additionalProperties: false, properties: { logoMediaId: { type: [string, 'null'], format: uuid }, faviconMediaId: { type: [string, 'null'], format: uuid } } }
    MarketProfileInput:
      type: object
      additionalProperties: false
      required: [marketCode, enabled]
      properties:
        marketCode: { type: string, minLength: 2, maxLength: 16 }
        enabled: { type: boolean }
        eligibleProductIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
    ProductFields:
      type: object
      additionalProperties: false
      properties:
        baseSku: { type: [string, 'null'], maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
        brandId: { type: [string, 'null'], format: uuid }
        categoryIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        marketCodes: { type: array, minItems: 1, uniqueItems: true, items: { type: string, maxLength: 16 } }
        allowedPaymentChannels:
          type: array
          uniqueItems: true
          maxItems: 3
          items: { type: string, enum: [cod, manual, online] }
          description: >-
            Channels this product may be paid with. Omit or send an empty array for
            "unrestricted". Once set, a cart containing this product can only use the
            intersection of every line's allowed channels.
        translations: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ProductTranslationInput' } }
        variants: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ProductVariantInput' } }
        media: { type: array, items: { $ref: '#/components/schemas/ProductMediaInput' } }
        attributes: { type: array, items: { $ref: '#/components/schemas/AttributeValueInput' } }
        taxClassRef: { type: [string, 'null'], maxLength: 80 }
    ProductWriteRequest:
      allOf:
        - { $ref: '#/components/schemas/ProductFields' }
        - type: object
          required: [categoryIds, marketCodes, translations, variants]
    ProductPatchRequest:
      allOf: [{ $ref: '#/components/schemas/ProductFields' }]
      minProperties: 1
      description: Partial update; omitted fields are unchanged. Product status and stock quantities are not writable here.
    ProductTranslationInput:
      type: object
      additionalProperties: false
      required: [locale, name, slug]
      properties:
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, minLength: 1, maxLength: 180 }
        shortDescription: { type: [string, 'null'], maxLength: 320 }
        description: { type: [string, 'null'], maxLength: 50000 }
        seoTitle: { type: [string, 'null'], maxLength: 70 }
        seoDescription: { type: [string, 'null'], maxLength: 320 }
    ProductVariantInput:
      type: object
      additionalProperties: false
      required: [sku, optionValues, priceMinor, currency]
      properties:
        sku: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
        optionValues: { type: object, minProperties: 1, additionalProperties: { type: string, maxLength: 100 } }
        priceMinor: { type: integer, minimum: 0 }
        compareAtMinor: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [active, inactive], default: active }
    ProductMediaInput:
      type: object
      additionalProperties: false
      required: [mediaId, position]
      properties:
        mediaId: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        altByLocale: { type: object, additionalProperties: { type: string, maxLength: 300 } }
    AttributeValueInput:
      type: object
      additionalProperties: false
      required: [attributeCode, value]
      properties:
        attributeCode: { type: string, maxLength: 80 }
        value: { type: [string, number, boolean], maxLength: 200 }
    ProductPublishRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, marketCodes]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        marketCodes: { type: array, minItems: 1, uniqueItems: true, items: { type: string, maxLength: 16 } }
        publishedAt: { type: [string, 'null'], format: date-time, description: Null or omitted means publish now; future UTC instant schedules publication. }
    CategoryFields:
      type: object
      additionalProperties: false
      properties:
        parentId: { type: [string, 'null'], format: uuid }
        position: { type: integer, minimum: 0 }
        enabled: { type: boolean, default: true }
        translations: { type: array, minItems: 1, items: { $ref: '#/components/schemas/LabelTranslationInput' } }
    CategoryWriteRequest:
      allOf:
        - { $ref: '#/components/schemas/CategoryFields' }
        - type: object
          required: [translations]
    CategoryPatchRequest:
      allOf: [{ $ref: '#/components/schemas/CategoryFields' }]
      minProperties: 1
    CollectionTranslationInput:
      type: object
      additionalProperties: false
      required: [locale, name]
      properties:
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: [string, 'null'], maxLength: 180, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: [string, 'null'], maxLength: 3000 }
    CollectionFields:
      type: object
      additionalProperties: false
      properties:
        position: { type: integer, minimum: 0 }
        enabled: { type: boolean, default: true }
        translations: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CollectionTranslationInput' } }
        productIds: { type: array, maxItems: 200, items: { type: string, format: uuid } }
    CollectionWriteRequest:
      allOf:
        - { $ref: '#/components/schemas/CollectionFields' }
        - type: object
          required: [translations]
    CollectionPatchRequest:
      allOf: [{ $ref: '#/components/schemas/CollectionFields' }]
      minProperties: 1
    BrandFields:
      type: object
      additionalProperties: false
      properties:
        logoMediaId: { type: [string, 'null'], format: uuid }
        enabled: { type: boolean, default: true }
        translations: { type: array, minItems: 1, items: { $ref: '#/components/schemas/LabelTranslationInput' } }
    BrandWriteRequest:
      allOf:
        - { $ref: '#/components/schemas/BrandFields' }
        - type: object
          required: [translations]
    BrandPatchRequest:
      allOf: [{ $ref: '#/components/schemas/BrandFields' }]
      minProperties: 1
    LabelTranslationInput:
      type: object
      additionalProperties: false
      required: [locale, name]
      properties:
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: [string, 'null'], maxLength: 180 }
        description: { type: [string, 'null'], maxLength: 50000 }
    MediaUploadTargetRequest:
      type: object
      additionalProperties: false
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
    MediaUploadCompleteRequest:
      type: object
      additionalProperties: false
      required: [objectKey, sha256]
      properties:
        objectKey: { type: string, minLength: 1, maxLength: 512 }
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    PageFields:
      type: object
      additionalProperties: false
      properties:
        pageKey: { type: string, minLength: 1, maxLength: 100 }
        pageType: { type: string, minLength: 1, maxLength: 80 }
        translations: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PageTranslationInput' } }
        blocks: { type: array, items: { $ref: '#/components/schemas/ContentBlockInput' } }
    PageWriteRequest:
      allOf:
        - { $ref: '#/components/schemas/PageFields' }
        - type: object
          required: [pageKey, pageType, translations, blocks]
    PagePatchRequest:
      allOf: [{ $ref: '#/components/schemas/PageFields' }]
      minProperties: 1
      description: Partial update; omitted fields are unchanged.
    PageTranslationInput:
      type: object
      additionalProperties: false
      required: [locale, title, slug, indexable]
      properties:
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        title: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, minLength: 1, maxLength: 180 }
        seoTitle: { type: [string, 'null'], maxLength: 70 }
        seoDescription: { type: [string, 'null'], maxLength: 320 }
        indexable: { type: boolean, default: false }
    ContentBlockInput:
      type: object
      additionalProperties: false
      required: [id, type, visible, position, config]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, minLength: 1, maxLength: 80, description: Must be registered by this instance's storefront theme. }
        visible: { type: boolean }
        position: { type: integer, minimum: 0 }
        config: { type: object, additionalProperties: true, description: Validated against the registered schema for block type. }
    PreviewRequest:
      type: object
      additionalProperties: false
      required: [locale, viewport, expectedVersion]
      properties:
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        viewport: { type: string, enum: [mobile, desktop] }
        expectedVersion: { type: integer, minimum: 1 }
        ttlMinutes: { type: integer, minimum: 5, maximum: 1440, description: Defaults to 60 minutes; the hard ceiling is 24 hours. }
    PreviewTokenResult:
      type: object
      additionalProperties: false
      required: [token, path, locale, viewport, expiresAt, pageVersion]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        path: { type: string, pattern: '^/(zh-CN|zh-HK|en)/preview/[A-Za-z0-9_-]{43}\?viewport=(mobile|desktop)$' }
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        viewport: { type: string, enum: [mobile, desktop] }
        expiresAt: { type: string, format: date-time }
        pageVersion: { type: integer, minimum: 1 }
    RedirectWriteRequest:
      type: object
      additionalProperties: false
      required: [locale, fromPath, toPath]
      properties:
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        fromPath: { type: string, pattern: '^/[A-Za-z0-9._~-][A-Za-z0-9._~/-]*$', minLength: 2, maxLength: 300 }
        toPath: { type: string, pattern: '^/[A-Za-z0-9._~-][A-Za-z0-9._~/-]*$', minLength: 2, maxLength: 300 }
        statusCode: { type: integer, enum: [301, 308], default: 301 }
    PagePublishRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        mode: { type: string, enum: [immediate, scheduled], default: immediate }
        scheduledAt: { type: [string, 'null'], format: date-time }
    PageRollbackRequest:
      type: object
      additionalProperties: false
      required: [sourceVersion, reason, expectedVersion]
      properties:
        sourceVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        expectedVersion: { type: integer, minimum: 1 }
    MerchandisingWriteRequest:
      type: object
      additionalProperties: false
      description: Draft replacement for one page layout. expectedVersion 1 means the layout does not exist yet.
      required: [expectedVersion, sections]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        sections:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/MerchandisingSectionInput' }
    MerchandisingSectionInput:
      type: object
      additionalProperties: false
      required: [sectionId, type, visible, position, sortMode, limit]
      properties:
        sectionId: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9][a-z0-9-]*$' }
        type: { type: string, enum: [product_grid] }
        visible: { type: boolean }
        position: { type: integer, minimum: 0, maximum: 11 }
        titleByLocale: { type: object, additionalProperties: { type: string, minLength: 1, maxLength: 80 } }
        sortMode: { type: string, enum: [manual, newest, fulfilled_sales_30d, price_asc, price_desc] }
        limit: { type: integer, minimum: 1, maximum: 24 }
        productIds: { type: array, maxItems: 24, uniqueItems: true, items: { type: string, format: uuid } }
        categoryIds: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
        collectionId:
          type: [string, 'null']
          format: uuid
          description: Candidate filter for dynamic sections. On a collection page it must equal the page collection (otherwise MERCHANDISING_COLLECTION_OUT_OF_SCOPE); manual sections reject it as a mode conflict.
    MerchandisingPublishRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        note: { type: [string, 'null'], maxLength: 500 }
    MerchandisingWithdrawRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ThemeSectionInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [hero, about, product_grid, rich_text, faq, content_card] }
        params: { type: object, maxProperties: 20, additionalProperties: { type: [string, number, boolean] } }
    ThemeConfigInput:
      type: object
      additionalProperties: false
      required: [brand, tokens, homeSections]
      properties:
        brand:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 60 }
            brandLatin: { type: string, maxLength: 60 }
            tagline: { type: string, maxLength: 200 }
            logoMediaId: { type: [string, 'null'], format: uuid }
            faviconMediaId: { type: [string, 'null'], format: uuid }
            whatsappNumber: { type: string, maxLength: 30 }
            whatsappGreeting: { type: string, maxLength: 200 }
        tokens:
          type: object
          additionalProperties: false
          required: [primaryColor, inkColor, paperColor, fontPair, radius]
          properties:
            primaryColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            inkColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            paperColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            fontPair: { type: string, enum: [editorial-jp, modern-sans, classic-serif] }
            radius: { type: number, minimum: 0, maximum: 64 }
        navigation: { type: array, maxItems: 12, items: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' } }
        homeSections: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/ThemeSectionInput' } }
    ThemeWriteRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, config]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        config: { $ref: '#/components/schemas/ThemeConfigInput' }
    ThemePublishRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        note: { type: [string, 'null'], maxLength: 500 }
    ThemeWithdrawRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ThemeRollbackRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, version]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
    ThemeConfigView:
      type: object
      additionalProperties: false
      required: [brand, tokens, homeSections]
      description: Theme configuration as stored by the server (draft or published)
      properties:
        brand:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 60 }
            brandLatin: { type: string, maxLength: 60 }
            tagline: { type: string, maxLength: 200 }
            logoMediaId: { type: [string, 'null'], format: uuid }
            faviconMediaId: { type: [string, 'null'], format: uuid }
            whatsappNumber: { type: string, maxLength: 30 }
            whatsappGreeting: { type: string, maxLength: 200 }
        tokens:
          type: object
          additionalProperties: false
          required: [primaryColor, inkColor, paperColor, fontPair, radius]
          properties:
            primaryColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            inkColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            paperColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            fontPair: { type: string, enum: [editorial-jp, modern-sans, classic-serif] }
            radius: { type: number, minimum: 0, maximum: 64 }
        navigation: { type: array, maxItems: 12, items: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' } }
        homeSections: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/ThemeSectionInput' } }
    ThemeVersionView:
      type: object
      additionalProperties: false
      required: [version, note, publishedAt]
      properties:
        version: { type: integer, minimum: 1 }
        note: { type: [string, 'null'], maxLength: 500 }
        publishedAt: { type: string, format: date-time }
    ThemeDocView:
      type: object
      additionalProperties: false
      required: [status, version, config, published, publishedAt, versions, updatedAt]
      properties:
        status: { type: string, enum: [draft, published] }
        version: { type: integer, minimum: 1 }
        config: { anyOf: [{ $ref: '#/components/schemas/ThemeConfigView' }, { type: 'null' }] }
        published:
          anyOf:
            - type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                publishedAt: { type: [string, 'null'], format: date-time }
            - type: 'null'
        publishedAt: { type: [string, 'null'], format: date-time }
        versions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/ThemeVersionView' } }
        updatedAt: { type: [string, 'null'], format: date-time }
    ThemeDocEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ThemeDocView' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PublicThemeView:
      type: object
      additionalProperties: false
      required: [version, config]
      properties:
        version: { type: integer, minimum: 1 }
        config: { $ref: '#/components/schemas/ThemeConfigView' }
    PublicThemeEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PublicThemeView' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ImportCreateRequest:
      type: object
      additionalProperties: false
      required: [fileObjectKey, fileSha256, format, mode, commitMode, columnMapping, localeSet]
      properties:
        fileObjectKey: { type: string, minLength: 1, maxLength: 512 }
        fileSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        format: { type: string, enum: [csv, xlsx] }
        mode: { type: string, enum: [create_or_update_by_sku, create_only, update_only] }
        commitMode: { type: string, enum: [valid_rows, atomic] }
        columnMapping: { type: object, minProperties: 1, additionalProperties: { type: string } }
        localeSet: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [zh-CN, zh-HK, en] } }
    ImportExecuteRequest:
      type: object
      additionalProperties: false
      required: [confirmedFileSha256, confirmedMappingVersion, expectedValidRows]
      properties:
        confirmedFileSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        confirmedMappingVersion: { type: integer, minimum: 1 }
        expectedValidRows: { type: integer, minimum: 0 }
    ExportCreateRequest:
      type: object
      additionalProperties: false
      required: [resource, columns, redactionPolicyVersion]
      properties:
        resource: { type: string, enum: [products, orders, customers, inventory, payments, settlements] }
        filters: { type: object, additionalProperties: true }
        columns: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        locale: { type: [string, 'null'], enum: [zh-CN, zh-HK, en, null] }
        redactionPolicyVersion: { type: string, minLength: 1, maxLength: 80 }
    CartItemWriteRequest:
      type: object
      additionalProperties: false
      required: [variantId, quantity]
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        attribution: { $ref: '#/components/schemas/CartItemAttribution' }
    CartItemAttribution:
      type: object
      additionalProperties: false
      description: Optional anonymous section attribution captured by the theme adapter; the server decides whether it counts.
      required: [sectionId, sectionKey, publishVersionId, interactionId, consentState]
      properties:
        sectionId: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$' }
        sectionKey: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{1,63}$' }
        placementId: { type: [string, 'null'], maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$' }
        publishVersionId: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$' }
        interactionId: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
        pageKey: { type: [string, 'null'], maxLength: 128 }
        sessionId: { type: [string, 'null'], minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
        consentState: { type: string, enum: [granted, denied, unknown] }
        occurredAt: { type: [string, 'null'], format: date-time }
    CartItemUpdateRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 99 }
    CheckoutQuoteRequest:
      type: object
      additionalProperties: false
      required: [cartId, locale, marketCode, contact, shippingMethodId, policyAcceptances]
      properties:
        cartId: { type: string, format: uuid }
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        marketCode: { type: string, minLength: 2, maxLength: 16 }
        contact: { $ref: '#/components/schemas/ContactInput' }
        shippingAddress: { $ref: '#/components/schemas/AddressInput' }
        shippingMethodId: { type: string, format: uuid }
        couponCode: { type: [string, 'null'], maxLength: 80 }
        pointsToUse: { type: [integer, 'null'], minimum: 0, maximum: 1000000, description: Optional points the member wants to apply; server caps by balance and eligible merchandise amount. }
        policyAcceptances: { type: array, items: { $ref: '#/components/schemas/PolicyAcceptanceInput' } }
    ContactInput:
      type: object
      additionalProperties: false
      anyOf:
        - required: [email]
          properties:
            email: { type: string, minLength: 1 }
        - required: [phone]
          properties:
            phone: { type: string, minLength: 1, pattern: '\S' }
      properties:
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        fullName: { type: string, minLength: 1, maxLength: 120 }
    AddressInput:
      type: object
      additionalProperties: false
      required: [countryCode, addressLine1]
      properties:
        recipientName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: [string, 'null'], maxLength: 32 }
        countryCode: { type: string, pattern: '^[A-Za-z]{2}$',
          description: Case-insensitive on input; the server trims and uppercases it before validation. }
        regionCode: { type: [string, 'null'], maxLength: 80 }
        city: { type: [string, 'null'], maxLength: 120 }
        district: { type: [string, 'null'], maxLength: 120 }
        addressLine1: { type: string, minLength: 1, maxLength: 200 }
        addressLine2: { type: [string, 'null'], maxLength: 200 }
        postalCode: { type: [string, 'null'], maxLength: 32 }
    PolicyAcceptanceInput:
      type: object
      additionalProperties: false
      required: [policyKey, version, accepted]
      properties:
        policyKey: { type: string, maxLength: 80 }
        version: { type: string, maxLength: 80 }
        accepted: { type: boolean, const: true }
    CheckoutOrderRequest:
      type: object
      additionalProperties: false
      required: [quoteId, confirmedQuoteVersion, paymentMethodCode]
      properties:
        quoteId: { type: string, format: uuid }
        confirmedQuoteVersion: { type: integer, minimum: 1 }
        paymentMethodCode: { type: string, minLength: 1, maxLength: 80 }
        customerNote: { type: [string, 'null'], maxLength: 1000 }
    OtpRequest:
      type: object
      additionalProperties: false
      required: [email, locale, purpose]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        locale: { type: string, enum: [zh-CN, zh-HK, en] }
        purpose: { type: string, const: member_login }
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^\d{6}$', writeOnly: true }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reasonCode: { type: [string, 'null'], maxLength: 80 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    OrderCancelRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reasonCode: { type: [string, 'null'], maxLength: 80 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        expectedVersion: { type: integer, minimum: 1 }
        customerNotified: { type: boolean, default: false }
      description: Paid orders must use after-sales refund flow.
    OrderAddressChangeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, address]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        address: { $ref: '#/components/schemas/AddressInput' }
        customerConfirmationRef: { type: [string, 'null'], maxLength: 200 }
    OrderNoteRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 1000 }
    ShipmentLineInput:
      type: object
      additionalProperties: false
      required: [orderItemId, quantity]
      properties:
        orderItemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    ShipmentCreateRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ShipmentLineInput' } }
        carrierCode: { type: [string, 'null'], maxLength: 80 }
        carrierName: { type: [string, 'null'], maxLength: 120 }
        trackingNumber: { type: [string, 'null'], maxLength: 160 }
        note: { type: [string, 'null'], maxLength: 1000 }
    ShipmentDispatchRequest:
      type: object
      additionalProperties: false
      required: [dispatchedAt]
      properties:
        dispatchedAt: { type: string, format: date-time }
        trackingNumber: { type: [string, 'null'], maxLength: 160 }
        evidenceRef: { type: [string, 'null'], maxLength: 200 }
        overrideReason:
          type: [string, 'null']
          maxLength: 500
          description: >-
            Required only when the order requires prepayment and no settled payment exists.
            Providing it dispatches anyway and is recorded in the audit log; omitting it
            yields 409 PAYMENT_REQUIRED_BEFORE_DISPATCH.
    ShipmentDeliverRequest:
      type: object
      additionalProperties: false
      required: [deliveredAt]
      properties:
        deliveredAt: { type: string, format: date-time }
        evidenceRef: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 1000 }
    CarrierStatusEventRequest:
      type: object
      additionalProperties: false
      description: >-
        Signed carrier callback. The body contains identifiers and delivery status only; no customer
        contact, address, payment credential or raw tracking URL is accepted.
      required: [eventId, shipmentId, status, occurredAt]
      properties:
        eventId: { type: string, minLength: 16, maxLength: 128 }
        shipmentId: { type: string, format: uuid }
        status: { type: string, enum: [in_transit, out_for_delivery, delivered, exception, returned] }
        occurredAt: { type: string, format: date-time }
        trackingNumber: { type: string, minLength: 1, maxLength: 160 }
        note: { type: string, minLength: 1, maxLength: 500 }
    CarrierWebhookAck:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [received, duplicate, shipmentStatus]
          properties:
            received: { type: boolean }
            duplicate: { type: boolean }
            shipmentStatus: { type: string, enum: [created, dispatched, delivered] }
        meta:
          type: object
          additionalProperties: false
          required: [requestId]
          properties:
            requestId: { type: string, maxLength: 128 }
    PaymentMethodPatchRequest:
      type: object
      additionalProperties: false
      required: [providerCode, environment, enabled]
      properties:
        providerCode: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$' }
        environment: { type: string, enum: [sandbox, production] }
        enabled: { type: boolean }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        publicConfig: { type: object, additionalProperties: true }
        secretRef: { type: [string, 'null'], maxLength: 256, writeOnly: true }
        approvalReference: { type: [string, 'null'], maxLength: 200 }
    PaymentStatus:
      type: string
      enum: [pending, authorized, succeeded, failed, cancelled, unknown, collected, rejected, returned]
      description: >-
        Ledger state. Unknown means the provider has not answered yet and must stay unknown until a
        server-side query or webhook resolves it; it can never be forced to failed here.
    AdminPaymentMethod:
      type: object
      additionalProperties: false
      required: [id, providerCode, environment, displayName, enabled, approvalStatus, publicConfig,
        secretConfigured, connectionStatus, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        providerCode: { type: string, pattern: '^[a-z][a-z0-9_]{1,31}$' }
        environment: { type: string, enum: [sandbox, production] }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        enabled: { type: boolean }
        approvalStatus: { type: string, enum: [approved, unapproved] }
        approvalReference: { type: [string, 'null'], maxLength: 200 }
        approvedAt: { type: [string, 'null'], format: date-time }
        publicConfig: { type: object, additionalProperties: { type: string, maxLength: 200 } }
        secretConfigured: { type: boolean, description: Whether a credential reference is stored; the reference itself is never returned. }
        secretFingerprint: { type: [string, 'null'], pattern: '^[0-9a-f]{16}$' }
        connectionStatus: { type: string, enum: [unverified, ok, failed] }
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminPayment:
      type: object
      additionalProperties: false
      required: [id, publicPaymentNumber, orderId, publicOrderNumber, providerCode, environment, channel,
        status, amountMinor, currency, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        publicPaymentNumber: { type: string, pattern: '^PAY-[0-9]{8}-[A-Z0-9]{6}$' }
        orderId: { type: string, format: uuid }
        publicOrderNumber: { type: string, maxLength: 64 }
        providerCode: { type: string, pattern: '^[a-z][a-z0-9_]{1,31}$' }
        environment: { type: string, enum: [sandbox, production] }
        channel: { type: string, enum: [cod, manual, online] }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        providerTransactionId: { type: [string, 'null'], maxLength: 160 }
        paidAt: { type: [string, 'null'], format: date-time }
        returnedAt: { type: [string, 'null'], format: date-time }
        reference: { type: [string, 'null'], maxLength: 200 }
        failureCode: { type: [string, 'null'], maxLength: 80 }
        failureMessage: { type: [string, 'null'], maxLength: 1000 }
        recordedBy: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, type, toStatus, source, occurredAt]
            properties:
              id: { type: string, format: uuid }
              type: { type: string, enum: [created, collected, rejected, returned, succeeded, cancelled, failed] }
              fromStatus: { type: [string, 'null'] }
              toStatus: { $ref: '#/components/schemas/PaymentStatus' }
              source: { type: string, enum: [admin, system, provider] }
              actorId: { type: [string, 'null'], format: uuid }
              occurredAt: { type: string, format: date-time }
    PaymentMethodEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AdminPaymentMethod' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PaymentMethodListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
