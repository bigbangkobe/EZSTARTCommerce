        - { $ref: '#/components/parameters/ReportKey' }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: timezone, in: query, required: true, schema: { type: string, description: IANA time zone identifier } }
        - { name: marketCode, in: query, required: false, schema: { type: string } }
        - { name: paymentMethodCode, in: query, required: false, schema: { type: string } }
        - { name: locale, in: query, required: false, schema: { type: string }, description: Funnel only - IANA locale filter }
        - { name: deviceClass, in: query, required: false, schema: { type: string, enum: [desktop, mobile, tablet] }, description: Funnel only - device class filter }
        - { name: source, in: query, required: false, schema: { type: string }, description: Funnel only - UTM source filter }
        - { name: pageKey, in: query, required: false, schema: { type: string, maxLength: 128 }, description: Placement only - page identifier filter }
        - { name: sectionKey, in: query, required: false, schema: { type: string, maxLength: 64 }, description: Placement only - stable section key filter }
        - { name: publishVersionId, in: query, required: false, schema: { type: string, maxLength: 64 }, description: Placement only - content release filter }
        - { name: groupBy, in: query, required: false, schema: { type: string, enum: [step, device, source, locale, day, section, sectionId, page, version] }, description: Funnel or placement grouping dimension }
      responses:
        '200': { $ref: '#/components/responses/ReportSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/report-exports:
    post:
      tags: [Reports]
      operationId: createReportExport
      summary: Create an asynchronous report export
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: reports.export
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportExportRequest' }
      responses:
        '202': { $ref: '#/components/responses/ReportExportAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/report-exports/{id}:
    get:
      tags: [Reports]
      operationId: getReportExport
      summary: Get report export status and short-lived download URL
      security: [{ AdminSession: [] }]
      x-permission: reports.export
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      responses:
        '200': { $ref: '#/components/responses/ReportExportSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/report-exports/{id}/download:
    get:
      tags: [Reports]
      operationId: downloadReportExport
      summary: Download a completed, unexpired CSV export
      security: [{ AdminSession: [] }]
      x-permission: reports.export
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      responses:
        '200':
          description: CSV payload with report filters and metric definitions in the preamble
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Content-Disposition: { schema: { type: string, description: Attachment filename } }
          content:
            text/csv:
              schema: { type: string, description: RFC 4180 CSV with UTF-8 BOM }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: Search immutable audit records
      description: Newest first. Read-only by design; there is no update or delete endpoint for audit records.
      security: [{ AdminSession: [] }]
      x-permission: audit.read
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/AdminAuditLogListSuccess' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Get restricted health and readiness checks
      security: [{ AdminSession: [] }]
      x-permission: operations.health.read
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/operations/backup:
    post:
      tags: [Operations]
      operationId: createBackupJob
      summary: Start an authorized backup job
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: instance.backup
      x-mfa-required: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/operations/jobs/{id}:
    get:
      tags: [Operations]
      operationId: getOperationJob
      summary: Get an authorized operation job status
      security: [{ AdminSession: [] }]
      x-permission: instance.backup
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /admin/after-sales:
    get:
      tags: [AfterSales]
      operationId: listAfterSalesCases
      summary: List after-sales cases
      security: [{ AdminSession: [] }]
      x-permission: aftersales.read
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AfterSalesCaseStatus' }
        - name: caseType
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AfterSalesCaseType' }
        - name: orderId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/AfterSalesCaseListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    post:
      tags: [AfterSales]
      operationId: createAfterSalesCase
      summary: Create an after-sales case linked to an order
      description: >-
        The server computes the selectable quantities from the order lines minus quantities already
        requested by other live cases of the same order; the client cannot ask for more.
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: aftersales.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSalesCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/AfterSalesCaseCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/after-sales/{id}:
    get:
      tags: [AfterSales]
      operationId: getAfterSalesCase
      summary: Get an after-sales case and its history
      security: [{ AdminSession: [] }]
      x-permission: aftersales.read
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      responses:
        '200': { $ref: '#/components/responses/AfterSalesCaseSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/after-sales/{id}/approve:
    post:
      tags: [AfterSales]
      operationId: approveAfterSalesCase
      summary: Approve an eligible after-sales case
      description: >-
        Approving a cancellation case cancels the order and releases its inventory hold; that is only
        allowed while the order is unshipped and unpaid. Other case types lock the approved quantities
        and refundable amount without moving any money.
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: aftersales.approve
      parameters:
        - { $ref: '#/components/parameters/UuidId' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/AfterSalesCaseSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/after-sales/{id}/reject:
    post:
      tags: [AfterSales]
      operationId: rejectAfterSalesCase
      summary: Reject an after-sales case with an audited reason
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: aftersales.approve
      parameters: [{ $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/AfterSalesCaseSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/after-sales/{id}/return-shipment:
    post:
      tags: [AfterSales]
      operationId: registerAfterSalesReturnShipment
      summary: Record the carrier and tracking number of a return parcel
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: aftersales.inspect
      parameters: [{ $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnShipmentRequest' }
      responses:
        '201': { $ref: '#/components/responses/AfterSalesCaseSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/after-sales/{id}/receive-return:
    post:
      tags: [AfterSales]
      operationId: receiveAfterSalesReturn
      summary: Record physical receipt of returned items
      description: >-
        Receiving does not change sellable stock. Quantities are capped by what the case approved and
        by what has not already been received.
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: aftersales.inspect
      parameters: [{ $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnReceiptRequest' }
      responses:
        '200': { $ref: '#/components/responses/AfterSalesCaseSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/after-sales/{id}/inspect:
    post:
      tags: [AfterSales]
      operationId: inspectAfterSalesReturn
      summary: Record item inspection and inventory disposition
      description: >-
        Only sellable quantities return to on-hand stock; damaged, quarantined and scrapped items are
        recorded as a disposition movement without increasing sellable stock.
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: aftersales.inspect
      parameters: [{ $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnInspectionRequest' }
      responses:
        '200': { $ref: '#/components/responses/AfterSalesCaseSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/after-sales/{id}/refund:
    post:
      tags: [AfterSales]
      operationId: refundAfterSalesCase
      summary: Request refund for an approved after-sales case
      description: >-
        The payment is chosen by the server from settled payments of the order. The amount is capped by
        both the case approval and the refundable balance of that payment.
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: refunds.create
      x-mfa-required: true
      parameters: [{ $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSalesRefundRequest' }
      responses:
        '201': { $ref: '#/components/responses/RefundCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/after-sales/{id}/close:
    post:
      tags: [AfterSales]
      operationId: closeAfterSalesCase
      summary: Close a case once no refund is still in flight
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: aftersales.manage
      parameters:
        - { $ref: '#/components/parameters/UuidId' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/AfterSalesCaseSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
components:
  securitySchemes:
    DeploymentBootstrap:
      type: apiKey
      in: header
      name: X-Bootstrap-Token
      description: High-entropy single-use deployment secret provisioned outside the web API; bootstrap endpoint disabled
        after first owner is committed. Never put in URLs, images, logs or ordinary config.
    AdminMfaSetup:
      type: apiKey
      in: cookie
      name: ez_admin_setup
      description: Browser-bound short-lived enrollment capability; never authorizes admin business APIs or verification
        of an existing factor.
    AdminLoginChallenge:
      type: apiKey
      in: cookie
      name: ez_admin_challenge
      description: Short-lived browser-bound pre-authentication cookie; authorizes only MFA verification and never admin resources.
    AdminSession:
      type: apiKey
      in: cookie
      name: ez_admin_session
      description: HttpOnly, Secure, SameSite session cookie; server-side session is revocable.
    GuestCartSession:
      type: apiKey
      in: cookie
      name: ez_guest_cart
      description: Random high-entropy guest cart session; does not authorize order/customer access.
    MemberSession:
      type: apiKey
      in: cookie
      name: ez_member_session
      description: Optional verified member session; never required for guest checkout.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on cookie-authenticated state-changing browser requests.
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageKey:
      name: pageKey
      in: path
      required: true
      description: 'Merchandising scope: `home`, `category:<uuid>` or `collection:<uuid>`. Ids are used so renaming or changing a slug cannot orphan a published layout.'
      schema:
        type: string
        minLength: 4
        maxLength: 47
        pattern: '^(home|(category|collection):[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
      example: 'category:6f1c2b24-6f2a-4c1e-9a3e-2f7f7b6d1c11'
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 180 }
    ProviderCode:
      name: provider
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$' }
    CarrierCode:
      name: carrierCode
      in: path
      required: true
      description: Pre-registered carrier code whose webhook secret is configured on the instance.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$' }
    CarrierTimestamp:
      name: X-Carrier-Timestamp
      in: header
      required: true
      description: Unix seconds. Callbacks outside a five-minute window are replayed or rejected.
      schema: { type: string, pattern: '^[0-9]{10}$' }
    CarrierSignature:
      name: X-Carrier-Signature
      in: header
      required: true
      description: v1=HMAC-SHA256(secret, timestamp + "." + canonicalJson(body)), lowercase hex.
      schema: { type: string, pattern: '^v1=[0-9a-f]{64}$' }
    ReportKey:
      name: reportKey
      in: path
      required: true
      description: Server-computed report key from the closed set in components.schemas.ReportKey.
      schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$', enum: [sales_summary, orders_by_status, orders_by_payment, orders_by_method, product_sales, inventory, coupons, members, funnel, placement] }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    SearchQuery:
      name: q
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    Locale:
      name: locale
      in: query
      required: true
      schema: { type: string, enum: [zh-CN, zh-HK, en] }
    MarketCode:
      name: marketCode
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 16 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: ETag for optimistic concurrency; stale value returns VERSION_CONFLICT.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
      description: Same key and same request returns the original result; same key with different request returns IDEMPOTENCY_CONFLICT.
  headers:
    X-Request-Id:
      description: Correlation ID for this request.
      schema: { type: string, maxLength: 128 }
    Retry-After:
      description: Seconds before a limited client may retry.
      schema: { type: integer, minimum: 1 }
  responses:
    ReadinessSuccess:
      description: Configured identity database and checked migrations are ready.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReadinessStatusEnvelope' }
    AdminInvitationSuccess:
      description: AdminInvitationSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
        ETag:
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
          description: Invitation version, not user version; required by resend/revoke.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminInvitationSummaryEnvelope'
    MarketReviewSuccess:
      description: MarketReviewSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
        ETag:
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
          description: New StoreConfiguration version after recording review; recording approval does not enable trading.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketReviewRecordEnvelope'
    HealthSuccess:
      description: HealthSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthStatusEnvelope'
    AdminMfaSetupRequired:
      description: AdminMfaSetupRequired
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
        Set-Cookie:
          schema:
            type: string
          description: Sets ez_admin_setup; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/admin/auth/mfa. Short-lived
            enrollment capability bound to challengeId and browser. Grants no admin resource access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminMfaSetupChallengeEnvelope'
    AdminMfaEnrollmentSuccess:
      description: AdminMfaEnrollmentSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminMfaEnrollmentEnvelope'
    AdminMfaEnrollmentConfirmedSuccess:
      description: AdminMfaEnrollmentConfirmedSuccess
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
        Set-Cookie:
          schema:
            type: string
          description: Rotates formal ez_admin_session (HttpOnly; Secure; SameSite=Lax; Path=/api/v1/admin); consumes
            and clears ez_admin_setup using its original Path; revokes previous admin sessions. Never include session
