openapi: 3.1.0
info:
  title: EZSTARTCommerce Store API
  version: 1.0.0
  description: >-
    Versioned REST API contract for the independently deployed EZSTARTCommerce
    instance. Human-readable rules and rationale are in API_SPEC.md. Unknown
    request properties are rejected unless an operation schema explicitly
    allows them. All timestamps are UTC; all monetary values use integer minor
    units and an ISO 4217 currency.
  contact:
    name: EZSTARTCommerce API contract
servers:
  - url: https://{host}/api/v1
    description: Customer-specific production or staging instance
    variables:
      host:
        default: shop.example.com
tags:
  - name: AdminAuth
  - name: AdminAccess
  - name: StoreConfig
  - name: Catalog
  - name: Content
  - name: Imports
  - name: Storefront
  - name: Checkout
  - name: Members
  - name: Orders
  - name: Payments
  - name: Settlements
  - name: Shipping
  - name: Customers
  - name: Privacy
  - name: Promotions
  - name: Inventory
  - name: Notifications
  - name: Reports
  - name: AfterSales
  - name: Audit
  - name: Operations
paths:
  /admin/users/{id}/invitation:
    get:
      tags:
      - AdminAccess
      operationId: getAdminInvitation
      summary: getAdminInvitation
      security:
      - AdminSession: []
      x-permission: staff.read
      responses:
        '200':
          $ref: '#/components/responses/AdminInvitationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
      parameters:
      - $ref: '#/components/parameters/UuidId'
  /admin/users/{id}/invitation/resend:
    post:
      tags:
      - AdminAccess
      operationId: resendAdminInvitation
      summary: resendAdminInvitation
      security:
      - AdminSession: []
        CsrfToken: []
      x-permission: staff.manage
      responses:
        '200':
          $ref: '#/components/responses/AdminInvitationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
      parameters:
      - $ref: '#/components/parameters/UuidId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
  /admin/users/{id}/invitation/revoke:
    post:
      tags:
      - AdminAccess
      operationId: revokeAdminInvitation
      summary: revokeAdminInvitation
      security:
      - AdminSession: []
        CsrfToken: []
      x-permission: staff.manage
      responses:
        '200':
          $ref: '#/components/responses/AdminInvitationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
      parameters:
      - $ref: '#/components/parameters/UuidId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
  /admin/store-config/markets/{marketCode}/reviews:
    post:
      tags:
      - StoreConfig
      operationId: recordMarketReview
      summary: recordMarketReview
      security:
      - AdminSession: []
        CsrfToken: []
      x-permission: store.settings.manage
      responses:
        '200':
          $ref: '#/components/responses/MarketReviewSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
      parameters:
      - name: marketCode
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 16
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketReviewRequest'
      x-mfa-required: true
      x-owner-required: true
  /health/live:
    get:
      tags:
      - Operations
      operationId: getHealthLive
      summary: Process liveness
      security: []
      x-authentication: public
      responses:
        '200':
          $ref: '#/components/responses/HealthSuccess'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /health/ready:
    get:
      tags:
      - Operations
      operationId: getHealthReady
      summary: Dependency readiness
      security: []
      x-authentication: public
      responses:
        '200':
          $ref: '#/components/responses/ReadinessSuccess'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Returns 200 only when the configured identity database and checked migrations are ready. Without identity
        configuration returns 503 SERVICE_NOT_READY. Process liveness is not readiness.
  /admin/auth/bootstrap:
    post:
      tags:
      - AdminAuth
      operationId: bootstrapAdminOwner
      summary: Provision the first owner only while deployment setup is enabled
      security:
      - DeploymentBootstrap: []
      responses:
        '202':
          $ref: '#/components/responses/AdminMfaSetupRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapOwnerRequest'
      x-authentication: self-service-or-deployment
      x-rate-limit: account-and-ip
      x-origin-check: true
  /admin/auth/invitations/accept:
    post:
      tags:
      - AdminAuth
      operationId: acceptAdminInvitation
      summary: Consume an invitation and set password; mandatory MFA yields setup only
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AdminSessionSuccess'
        '202':
          $ref: '#/components/responses/AdminMfaSetupRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAdminInvitationRequest'
      x-authentication: self-service-or-deployment
      x-rate-limit: account-and-ip
      x-origin-check: true
  /admin/auth/mfa/enrollment-authorizations:
    post:
      tags:
      - AdminAuth
      operationId: authorizeAdminMfaEnrollment
      summary: Reauthenticate current user before optional MFA enrollment or factor replacement
      security:
      - AdminSession: []
        CsrfToken: []
      responses:
        '202':
          $ref: '#/components/responses/AdminMfaSetupRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeMfaEnrollmentRequest'
      x-authentication: restricted-enrollment
      x-rate-limit: account-and-ip
      x-origin-check: true
  /admin/auth/mfa/enrollments:
    post:
      tags:
      - AdminAuth
      operationId: startAdminMfaEnrollment
      summary: Create a pending TOTP factor; each start invalidates earlier pending enrollment
      security:
      - AdminMfaSetup: []
      responses:
        '201':
          $ref: '#/components/responses/AdminMfaEnrollmentSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMfaEnrollmentRequest'
      x-authentication: restricted-enrollment
      x-rate-limit: account-and-ip
      x-origin-check: true
  /admin/auth/mfa/enrollments/confirm:
    post:
      tags:
      - AdminAuth
      operationId: confirmAdminMfaEnrollment
      summary: Verify pending TOTP, atomically activate it and issue one-time recovery codes
      security:
      - AdminMfaSetup: []
      responses:
        '200':
          $ref: '#/components/responses/AdminMfaEnrollmentConfirmedSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmMfaEnrollmentRequest'
      x-authentication: restricted-enrollment
      x-rate-limit: account-and-ip
      x-origin-check: true
  /admin/auth/sessions:
    get:
      tags:
      - AdminAuth
      operationId: listOwnAdminSessions
      summary: List only current user active sessions
      security:
      - AdminSession: []
      responses:
        '200':
          $ref: '#/components/responses/AdminSessionListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
      x-authentication: self-service-or-deployment
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /admin/auth/sessions/{id}/revoke:
    post:
      tags:
      - AdminAuth
      operationId: revokeOwnAdminSession
      summary: Revoke a session belonging only to the current user
      security:
      - AdminSession: []
        CsrfToken: []
      responses:
        '200':
          $ref: '#/components/responses/AdminSessionRevokedSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      x-authentication: self-service-or-deployment
      parameters:
      - $ref: '#/components/parameters/UuidId'
      x-rate-limit: account-and-ip
      x-origin-check: true
  /admin/users/{id}/sessions:
    get:
      tags:
      - AdminAccess
      operationId: listAdminUserSessions
      summary: List active sessions for an authorized staff user
      security:
      - AdminSession: []
      responses:
        '200':
          $ref: '#/components/responses/AdminSessionListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permission: staff.read
      parameters:
      - $ref: '#/components/parameters/UuidId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /admin/auth/login:
    post:
      tags: [AdminAuth]
      operationId: adminLogin
      summary: Authenticate an admin user
      x-authentication: public
      x-rate-limit: account-and-ip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminSessionSuccess' }
        '202': { $ref: '#/components/responses/AdminMfaRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/auth/mfa/verify:
    post:
      tags: [AdminAuth]
      operationId: verifyAdminMfa
      summary: Verify a TOTP code or one-time recovery code
      x-authentication: pre-authentication
      security: [{ AdminLoginChallenge: [] }]
      x-rate-limit: account-and-ip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminSessionSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/auth/session:
    get:
      tags: [AdminAuth]
      operationId: getAdminSession
      summary: Get the current admin session and permission summary
      security: [{ AdminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminSessionSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/auth/logout:
    post:
      tags: [AdminAuth]
      operationId: logoutAdmin
      summary: Revoke the current admin session
      security: [{ AdminSession: [], CsrfToken: [] }]
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/auth/password:
    post:
      tags: [AdminAuth]
      operationId: changeAdminPassword
      summary: 已登录成员修改自己的密码（首次登录强制改密也走这里）
      security: [{ AdminSession: [], CsrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPasswordChangeRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminSessionSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/auth/password-reset:
    post:
      tags: [AdminAuth]
      operationId: requestAdminPasswordReset
      summary: Request a one-time password reset
      x-authentication: public
      x-rate-limit: account-and-ip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/PasswordResetRequest' }
                - { $ref: '#/components/schemas/PasswordResetCompleteRequest' }
      responses:
        '202': { $ref: '#/components/responses/PasswordResetRequestAccepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /admin/users:
    get:
      tags: [AdminAccess]
      operationId: listAdminUsers
      summary: List admin users
      security: [{ AdminSession: [] }]
      x-permission: staff.read
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/AdminUserListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    post:
      tags: [AdminAccess]
      operationId: inviteAdminUser
      summary: Invite a staff user
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: staff.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserInviteRequest' }
      responses:
        '201': { $ref: '#/components/responses/AdminUserSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/UuidId' }]
    get:
      tags: [AdminAccess]
      operationId: getAdminUser
      summary: Get an admin user
      security: [{ AdminSession: [] }]
      x-permission: staff.read
      responses:
        '200': { $ref: '#/components/responses/AdminUserSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    patch:
      tags: [AdminAccess]
      operationId: updateAdminUser
      summary: Update or deactivate an admin user
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: staff.manage
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserPatchRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminUserSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/users/{id}/sessions/revoke:
    post:
      tags: [AdminAccess]
      operationId: revokeAdminUserSessions
      summary: Revoke all sessions for an admin user
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: staff.manage
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminSessionsRevokedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /admin/roles:
    get:
      tags: [AdminAccess]
      operationId: listRoles
      summary: List roles and permission codes
      security: [{ AdminSession: [] }]
      x-permission: roles.manage
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/AdminRoleListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    post:
      tags: [AdminAccess]
      operationId: createRole
      summary: Create a role
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: roles.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleWriteRequest' }
      responses:
        '201': { $ref: '#/components/responses/AdminRoleSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/roles/{id}:
    parameters: [{ $ref: '#/components/parameters/UuidId' }]
    get:
      tags: [AdminAccess]
      operationId: getRole
      summary: Get a role
      security: [{ AdminSession: [] }]
      x-permission: roles.manage
      responses:
        '200': { $ref: '#/components/responses/AdminRoleSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    patch:
      tags: [AdminAccess]
      operationId: updateRole
      summary: Update a role
      security: [{ AdminSession: [], CsrfToken: [] }]
      x-permission: roles.manage
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePatchRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminRoleSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /admin/store-config:
    get:
      tags: [StoreConfig]
      operationId: getStoreConfig
      summary: Get store configuration
      security: [{ AdminSession: [] }]
      x-permission: store.settings.manage
      responses:
        '200': { $ref: '#/components/responses/StoreConfigurationSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    patch:
      tags: [StoreConfig]
      operationId: updateStoreConfig
      summary: Update store configuration
