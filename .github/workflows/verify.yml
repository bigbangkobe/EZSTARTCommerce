name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install -r packages/contracts/requirements-validation.txt
      - run: pnpm check
      - run: pnpm build:admin
      - run: node scripts/browser-tests.mjs install --with-deps chromium
      - run: pnpm test:browser
